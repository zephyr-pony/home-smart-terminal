# 小智服务端（带提醒桥补丁）
#
# 用法：
#   1. 把本目录的 Dockerfile / apply_patch.py / reminder_bridge.py 拷到 xiaozhi-server 源码根目录
#      （和上游的 app.py、core/、data/、models/ 同级）
#   2. cp docker-compose.example.yml docker-compose.yml
#   3. echo "XIAOMA_API_TOKEN=<小马的 API_TOKEN>" > .env
#   4. docker compose up -d --build
#
# 这套只依赖「本机跑着小马（8208 端口）」和上游镜像源，不依赖任何一台开发机。
services:
  xiaozhi-esp32-server:
    build: .
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
      # 小马地址：容器里的 127.0.0.1 是容器自己，走 host-gateway 回到宿主机。
      # 小马不在本机时改成它的局域网地址。
      - XIAOMA_BASE_URL=http://host.docker.internal:8208
      # 和小马 .env 里的 API_TOKEN 一致；放在同目录的 .env 里，别写进这个文件
      - XIAOMA_API_TOKEN=${XIAOMA_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # ws 服务端（设备从 OTA 响应里拿到这个地址）
      - "8400:8000"
      # http：OTA / 视觉分析
      - "8403:8003"
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
