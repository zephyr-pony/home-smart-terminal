<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>家庭智能终端 · 小马</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#faf4ea">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小马">
<style>
:root {
  /* 默认「暖米」：纸底 + 陶土主色 + 鼠尾草辅助（D82）。
     深色那套没有删，改叫「暖深」留给晚上，主题由 body[data-theme] 切，
     所有组件都只认这些变量，不各自写颜色。 */
  --bg: #faf4ea;
  --page-bg: linear-gradient(170deg, #fdf8f0 0%, #faf3e8 45%, #f5e7d5 100%);
  --surface: #fffdf9;
  --surface-alt: #fdf3e4;
  --user-bubble: #c4643f;
  --user-text: #fff8f2;
  --bot-bubble: #f5e9d9;
  --bot-text: #4a3e35;
  --text-primary: #332a24;
  --text-secondary: #8a7a6c;
  --accent: #c4643f;
  --accent-weak: rgba(196, 100, 63, .12);
  --ok: #6e8a61;
  --warn: #b4472f;
  --danger: #b4472f;
  --input-bg: #fdf7ee;
  --border: #ecdfd0;
  --record-active: #c0492f;
  --shadow: 0 6px 18px rgba(120, 90, 60, .10);
  --radius: 16px;
  --radius-sm: 10px;
}

body[data-theme="clay"] {
  --bg: #f7e3d5;
  --page-bg: linear-gradient(170deg, #fbeee3 0%, #f7e2d1 50%, #f0d3bd 100%);
  --surface: #fffaf5;
  --surface-alt: #f9e8db;
  --user-bubble: #b0522f;
  --bot-bubble: #f6e3d5;
  --bot-text: #4a352c;
  --text-primary: #3a2a22;
  --text-secondary: #8d6f5e;
  --accent: #b0522f;
  --accent-weak: rgba(176, 82, 47, .12);
  --input-bg: #fdf1e7;
  --border: #ecd3bf;
  --record-active: #a8452a;
}

body[data-theme="sage"] {
  --bg: #eef2e8;
  --page-bg: linear-gradient(170deg, #f5f8f0 0%, #edf2e6 50%, #e3ebdb 100%);
  --surface: #fbfdf8;
  --surface-alt: #eef4e7;
  --user-bubble: #6e8a61;
  --user-text: #f7faf4;
  --bot-bubble: #e9f0e0;
  --bot-text: #38412f;
  --text-primary: #2f382a;
  --text-secondary: #75816b;
  --accent: #6e8a61;
  --accent-weak: rgba(110, 138, 97, .14);
  --input-bg: #f6faf1;
  --border: #dbe5d2;
  --record-active: #5c7a4f;
}

body[data-theme="night"] {
  --bg: #2b211d;
  --page-bg: linear-gradient(170deg, #322620 0%, #2b211d 55%, #241b18 100%);
  --surface: #352924;
  --surface-alt: #40312b;
  --user-bubble: #b35c3b;
  --user-text: #fff4ec;
  --bot-bubble: #3c2e28;
  --bot-text: #f0e3d6;
  --text-primary: #f4e9dd;
  --text-secondary: #b9a496;
  --accent: #d98a5f;
  --accent-weak: rgba(217, 138, 95, .16);
  --ok: #9db98a;
  --warn: #e08a72;
  --danger: #e0705c;
  --input-bg: #332823;
  --border: #3c2f29;
  --record-active: #d1604a;
  --shadow: 0 6px 18px rgba(0, 0, 0, .25);
}

/* 背景：纯色纸底 / 晨光渐变（照片那档先不做） */
body[data-bg="paper"] { --page-bg: var(--bg); }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  /* iOS 主屏模式（standalone）下 100% 只算到安全区上方，底部会多出一条黑边，
     用 dvh 覆盖整个可视区域；-webkit-fill-available 兜底旧系统 */
  height: 100%;
  height: -webkit-fill-available;
  height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--page-bg, var(--bg)); background-attachment: fixed; color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex; flex-direction: column;
  /* 用 body 的高度（100dvh，包含底部安全区）铺满，不要用 innerHeight：
     iOS standalone 下 innerHeight 会比 screen.height 少一截，锁死它会留黑边 */
  height: 100%;
  max-width: 1080px; margin: 0 auto;
}

/* ---- status bar ---- */
/* 结构在下面「看板」一节重写过（时间 + 天气），这里只留 token 行 */
#token-row {
  display: flex; gap: 8px; margin-top: 10px;
}
#token-input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
#token-save {
  height: 34px; padding: 0 12px; border: none;
  border-radius: var(--radius-sm); background: var(--accent); color: #fff;
}

/* ---- messages ---- */
#messages {
  flex: 1; overflow-y: auto; padding: 16px 16px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg-row { display: flex; margin-bottom: 12px; }
.msg-row.user { justify-content: flex-end; }
.msg-row.bot  { justify-content: flex-start; }
.msg-row.error { justify-content: center; }

.bubble {
  max-width: 80%; padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px; line-height: 1.55;
  word-break: break-word;
  position: relative;
}
.msg-row.user .bubble {
  background: var(--user-bubble); color: var(--user-text);
  border-bottom-right-radius: 4px;
}
.msg-row.bot .bubble {
  background: var(--bot-bubble); color: var(--bot-text);
  border-bottom-left-radius: 4px;
}
.msg-row.error .bubble {
  background: rgba(232,93,93,.15); color: var(--danger);
  font-size: 14px; max-width: 90%; text-align: center;
}
/* 从系统通知点进来时的那条提醒，和普通对话区分开 */
.msg-row.reminder .bubble {
  border: 1px solid var(--accent);
  background: var(--accent-weak);
}

/* 任务提醒卡片：提醒原文 + 完成/延期/取消 */
.task-card .task-actions {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.task-card .task-postpone {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
}
.task-card .task-status {
  margin-top: 8px; font-size: 13px; color: var(--muted);
}

/* 概览的统计口径明细，一行小字 */
.stat-detail {
  margin-top: 8px; font-size: 13px; line-height: 1.6;
}

/* 轻量 Markdown 渲染后的元素 */
.bubble ul { margin: 4px 0; padding-left: 18px; }
.bubble li { margin: 2px 0; }
.bubble strong { font-weight: 700; }
.bubble code {
  padding: 1px 4px; border-radius: 4px;
  background: rgba(0,0,0,.07);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
}

.play-btn {
  display: inline-block; margin-top: 6px;
  padding: 4px 10px; font-size: 13px;
  background: var(--surface-alt); color: var(--accent);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; user-select: none;
  transition: background .15s;
}
.play-btn:active { background: var(--border); }

/* ---- tabs / views ---- */
#tabs {
  flex-shrink: 0; display: flex; gap: 4px;
  padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1; height: 34px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-secondary);
  font-size: 14px; cursor: pointer;
}
.tab.active { background: var(--surface-alt); color: var(--text-primary); font-weight: 600; }
#views { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.active { display: flex; flex-direction: column; }
.view-inner { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; }
.view-title { font-size: 18px; margin-bottom: 14px; }
.section-title { font-size: 14px; color: var(--text-secondary); margin: 18px 0 8px; }
.muted { color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
/* 绝对路径、模型名这类长串没有空格，必须允许任意位置断行，否则整页横向滚动 */
.muted, .field label { overflow-wrap: anywhere; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
}
.card .num { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.card .label { margin-top: 4px; font-size: 12px; color: var(--text-secondary); }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; line-height: 1.5;
}
.list-row .meta { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
/* 思考开关观察：开/没开用颜色分开，扫一眼就能看出比例 */
.think-pill {
  display: inline-block; margin-right: 6px; padding: 1px 6px;
  border-radius: 999px; font-size: 11px; font-weight: 600;
  background: var(--surface-alt); color: var(--text-secondary);
}
.think-pill.on { background: var(--accent-weak, rgba(90, 160, 240, .16)); color: var(--accent); }
/* 打印机状态：在线/离线用点的颜色区分，别等上传完才发现打不了 */
.printer-line {
  font-size: 13px; line-height: 1.6; margin-bottom: 6px;
  color: var(--text-secondary);
}
.printer-line .printer-dot {
  display: inline-block; width: 7px; height: 7px; margin-right: 6px;
  border-radius: 50%; background: var(--text-secondary); vertical-align: 1px;
}
.printer-line .printer-dot.on { background: #3fa45b; }
.printer-line .printer-dot.off { background: #d2665a; }
.row-actions { display: flex; gap: 8px; margin-top: 8px; }
.small-btn {
  padding: 5px 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface-alt);
  color: var(--accent); font-size: 12px; cursor: pointer;
}
.small-btn.danger { color: var(--danger); }
.empty { color: var(--text-secondary); font-size: 13px; padding: 10px 0; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.subtab {
  padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 999px; background: transparent;
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
}
.subtab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
.field input {
  width: 100%; height: 38px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.primary-btn {
  width: 100%; height: 42px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 4px;
}
.hidden { display: none !important; }
.data-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.data-toolbar input {
  flex: 1 1 160px; min-width: 0; height: 34px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.data-toolbar select {
  flex: 0 1 auto; min-width: 0; max-width: 130px; height: 34px; padding: 0 8px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.data-toolbar .small-btn { flex: 0 0 auto; height: 34px; }
/* 窄屏：搜索框单独占一行，筛选控件平分下一行，避免溢出屏幕 */
@media (max-width: 560px) {
  .data-toolbar input { flex: 1 1 100%; }
  .data-toolbar select { flex: 1 1 0; max-width: none; }
}
.pager {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 14px;
}
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(0, 0, 0, .55);
}
.modal-card {
  width: min(100%, 420px); padding: 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.modal-card select {
  width: 100%; height: 38px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}

/* ---- input area ---- */
#task-chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--surface-alt);
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary);
}
#task-chip .chip-label {
  flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
#task-chip button {
  flex-shrink: 0; background: none; border: 0; padding: 0 4px;
  color: var(--text-secondary); font-size: 14px; cursor: pointer;
}

#file-chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--surface-alt);
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary);
}
#file-chip .chip-label {
  flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
#file-chip button {
  flex-shrink: 0; background: none; border: 0; padding: 0 4px;
  color: var(--text-secondary); font-size: 14px; cursor: pointer;
}

#attach-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface-alt); color: var(--text-secondary);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#attach-btn:disabled { opacity: .5; cursor: not-allowed; }

#input-area {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

#record-btn {
  width: 56px; height: 56px; flex-shrink: 0;
  border-radius: 50%; border: none;
  background: var(--accent); color: #fff;
  font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
  user-select: none; position: relative;
}
#record-btn.recording {
  background: var(--record-active);
  transform: scale(1.08);
}
#record-btn:disabled {
  opacity: .5; cursor: not-allowed;
}

#record-label {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; white-space: nowrap;
  color: var(--record-active); font-weight: 600;
  opacity: 0; transition: opacity .15s;
  pointer-events: none;
}
#record-btn.recording #record-label { opacity: 1; }

#text-input {
  flex: 1; min-width: 0; height: 44px; padding: 0 14px;
  font-size: 16px; /* >=16px to prevent iOS zoom */
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 22px;
  outline: none;
  transition: border-color .15s;
}
#text-input::placeholder { color: var(--text-secondary); }
#text-input:focus { border-color: var(--accent); }

#send-btn {
  height: 44px; padding: 0 18px; flex-shrink: 0;
  border-radius: 22px; border: none;
  background: var(--accent); color: #fff;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
#send-btn:disabled { opacity: .5; cursor: not-allowed; }

/* 窄屏：录音、附件、发送三个按钮都要留得下，输入框优先让位 */
@media (max-width: 520px) {
  #input-area { gap: 8px; padding: 10px 10px calc(16px + env(safe-area-inset-bottom)); }
  #record-btn { width: 48px; height: 48px; }
  #attach-btn { width: 40px; height: 40px; }
  #send-btn { padding: 0 12px; }
}

/* ---- typing indicator ---- */
.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-secondary);
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

/* ================= 看板（D82） ================= */
/* 顶栏：时间 + 天气，原「3 件事等你」挪进今天卡标题 */
#status-bar {
  flex-shrink: 0;
  background: transparent; border-bottom: 0; position: relative;
  padding: calc(14px + env(safe-area-inset-top)) 18px 6px;
}
.head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#clock { font-size: 2.4rem; font-weight: 750; line-height: 1; letter-spacing: -.02em; }
#dayline { margin-top: 6px; font-size: 13px; color: var(--text-secondary); }
.status-line { margin-top: 6px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.status-line:empty { display: none; }
/* 手机上看板不需要「服务正常 · 记忆 N 条」这行诊断：数据本身就在下面；
   出错时（没有 data-ok）照常显示，别把故障藏起来 */
@media (max-width: 899px) {
  .status-line[data-ok="1"] { display: none; }
}
#token-row { margin-top: 10px; display: flex; gap: 8px; }
#token-input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; }
#token-save { height: 36px; padding: 0 14px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-family: inherit; font-weight: 600; }

/* 天气块（点开三天） */
#wx-btn {
  flex-shrink: 0; text-align: right; line-height: 1.2; padding: 6px 10px;
  background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
  color: var(--text-primary); font-family: inherit; cursor: pointer;
}
#wx-btn:hover { border-color: var(--border); background: var(--surface); }
#wx-btn .wx-now { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
#wx-btn .wx-temp { font-size: 1.5rem; font-weight: 700; }
#wx-btn .wx-sky { font-size: 12px; color: var(--text-secondary); display: block; margin-top: 1px; }
#wx-btn .wx-range { font-size: 11px; color: var(--text-secondary); opacity: .85; display: block; margin-top: 1px; }
#wx-btn .wx-wind { font-size: 11px; color: var(--text-secondary); opacity: .85; display: block; margin-top: 1px; }
#wx-btn svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.7; }
#wx-pop {
  position: absolute; right: 12px; top: calc(96px + env(safe-area-inset-top)); z-index: 60;
  width: min(340px, calc(100vw - 24px)); padding: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
#wx-pop .wx-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.wx-days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.wx-day { background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 4px; text-align: center; font-size: 11px; color: var(--text-secondary); line-height: 1.6; }
.wx-day b { display: block; font-size: 12px; color: var(--text-primary); }
.wx-day .hi { color: var(--accent); font-weight: 650; }

/* 看板主体 */
#view-board { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 10px; -webkit-overflow-scrolling: touch; }
.board { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 980px; margin: 0 auto; }
.board-side { display: flex; flex-direction: column; gap: 12px; }
.bcard {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
}
.bcard h2 {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 13px; font-weight: 650; letter-spacing: .04em;
  color: var(--text-secondary); margin-bottom: 10px;
}
.bcard h2 span { color: var(--accent); font-weight: 700; font-size: 12px; }
.brow { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.brow:first-child { border-top: 0; padding-top: 0; }
.bwhen { width: 46px; flex: none; font-size: 12px; font-weight: 700; color: var(--accent); padding-top: 2px; }
.bwhen.warn { color: var(--danger); }
.bbody { flex: 1; min-width: 0; }
.btitle { font-size: 15px; line-height: 1.35; color: var(--text-primary); }
.bmeta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.bmeta.warn { color: var(--danger); }
.bacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.bacts button {
  border: 1px solid var(--border); background: var(--surface-alt);
  color: var(--text-primary); font-size: 12px; padding: 4px 11px;
  border-radius: 999px; font-family: inherit; cursor: pointer;
}
.bacts button.primary { background: var(--accent); border-color: var(--accent); color: #fff8f2; font-weight: 650; }
.bacts button:disabled { opacity: .5; }
.done-line { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-secondary); }
/* 「今天」条目多时在卡片里自己滚，别把家里/最近顶出屏幕；滚动条不显示 */
.scroll-hint {
  margin-top: 8px; text-align: center; font-size: 12px;
  color: var(--accent); letter-spacing: .02em;
}
@media (max-width: 899px) {
  /* 手机上让三张卡都落在屏幕里：家里/最近按自然高度、绝不内部滚，
     今天吃掉剩下的空间、自己内部滚动。网关接上后家里会多几行，
     所以今天的最低高度压到 110px，宁可它滚也不让家里被裁。 */
  #view-board { display: flex; flex-direction: column; overflow-y: auto; align-items: stretch; }
  /* margin auto 在 flex 交叉轴上会让卡片按内容收缩（实测窄一圈），这里铺满 */
  .board { flex: 1 1 auto; min-height: 0; width: 100%; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  #card-today { flex: 0 1 auto; min-height: 110px; display: flex; flex-direction: column; }
  .board-side { flex: 0 0 auto; }
  .bcard { padding: 12px; }
  .bcard h2 { margin-bottom: 8px; }
  .kvline { padding: 4px 0; font-size: 13.5px; }
  #today-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;          /* Firefox */
    -ms-overflow-style: none;       /* 旧 Edge */
    overscroll-behavior: contain;   /* 滚到底不要把整页带着滚 */
  }
  #today-list::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* 还有内容没露出来时底部淡出一点，截断看起来是「还能滑」而不是「被切了」 */
  #today-list.fading {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent 100%);
  }
  #view-board { scrollbar-width: none; -ms-overflow-style: none; }
  #view-board::-webkit-scrollbar { display: none; }
}
.kvline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; padding: 5px 0; color: var(--text-primary); }
.kvline .k { color: var(--text-secondary); }
.kvline .v { text-align: right; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); }
.tag.warn { background: rgba(180, 71, 47, .14); color: var(--danger); }
.tag.ok { background: rgba(110, 138, 97, .16); color: var(--ok); }
.bempty { font-size: 13px; color: var(--text-secondary); padding: 2px 0; }

/* 底部：按住说话 + 聊天入口 */
#dock { flex-shrink: 0; display: flex; gap: 8px; align-items: center; padding: 8px 16px 6px; }
#dock-mic {
  flex: 1; height: 46px; border-radius: 999px; font-family: inherit; font-size: 15px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-primary);
  display: flex; align-items: center; justify-content: center; gap: 9px;
  box-shadow: var(--shadow); touch-action: none;
}
#dock-mic .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
#dock-mic.recording { background: var(--record-active); border-color: var(--record-active); color: #fff; }
#dock-mic.recording .dot { background: #fff; animation: blink 1s infinite; }
#dock-chat {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); cursor: pointer;
}
#dock-chat svg { width: 20px; height: 20px; stroke: var(--text-primary); fill: none; stroke-width: 1.7; }

/* 导航放到底部，聊天不再是 tab */
#tabs {
  flex-shrink: 0; padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--border); border-bottom: 0;
}
#tabs .tab { height: 38px; border-radius: 999px; }
#tabs .tab.active { background: var(--accent-weak); color: var(--accent); }

/* 聊天浮层：手机上整屏，宽屏变右侧抽屉 */
#chat-sheet {
  position: fixed; inset: 0; z-index: 80;
  display: flex; flex-direction: column;
  background: var(--page-bg, var(--bg));
  transform: translateY(103%); transition: transform .22s ease;
  visibility: hidden;
}
#chat-sheet.open { transform: none; visibility: visible; }
#chat-sheet .sheet-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; max-width: 620px; margin: 0 auto; }
.sheet-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.sheet-head .sheet-title { flex: 1; font-size: 15px; font-weight: 650; }
.sheet-head button {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-alt);
  color: var(--text-primary); font-family: inherit; font-size: 13px; cursor: pointer;
}
@media (min-width: 900px) {
  #chat-sheet { left: auto; width: 440px; border-left: 1px solid var(--border); box-shadow: -8px 0 30px rgba(60, 40, 25, .12); transform: translateX(105%); }
  #chat-sheet.open { transform: none; }
  .board { grid-template-columns: 1.55fr 1fr; align-items: start; }
  .view-inner { max-width: 880px; margin: 0 auto; width: 100%; }
  /* 宽屏上「按住说话」不必拉满一整行，居中一条更好按 */
  #dock { max-width: 560px; width: 100%; margin: 0 auto; }
}

/* 提醒到达时的浮条：不用切到聊天也能直接处理 */
#reminder-banner {
  position: fixed; z-index: 90; left: 12px; right: 12px;
  top: calc(12px + env(safe-area-inset-top));
  max-width: 520px; margin: 0 auto; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
#reminder-banner .rb-text { font-size: 14px; line-height: 1.5; }
#reminder-banner .rb-acts { display: flex; gap: 8px; margin-top: 10px; }
#reminder-banner .rb-acts button {
  border: 1px solid var(--border); background: var(--surface-alt);
  color: var(--text-primary); font-size: 13px; padding: 5px 12px;
  border-radius: 999px; font-family: inherit; cursor: pointer;
}
#reminder-banner .rb-acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff8f2; font-weight: 650; }

/* 设置里的外观 */
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.theme-chip {
  border: 2px solid var(--border); border-radius: 12px; padding: 8px 4px;
  background: var(--surface); color: var(--text-primary); font-family: inherit;
  font-size: 12px; cursor: pointer; text-align: center;
}
.theme-chip.active { border-color: var(--accent); }
.theme-chip .swatch { height: 22px; border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--border); }
.bg-grid { display: flex; gap: 8px; margin-top: 8px; }
.bg-chip { flex: 1; border: 2px solid var(--border); border-radius: 10px; padding: 6px; background: var(--surface); color: var(--text-primary); font-family: inherit; font-size: 12px; cursor: pointer; }
.bg-chip.active { border-color: var(--accent); }
.bg-chip .paper { height: 26px; border-radius: 6px; margin-bottom: 4px; border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="app">
  <header id="status-bar">
    <div class="head-row">
      <div>
        <div id="clock">--:--</div>
        <div id="dayline">正在连接…</div>
      </div>
      <button id="wx-btn" class="hidden" type="button"></button>
    </div>
    <div class="status-line" id="status-text"></div>
    <div id="token-row" class="hidden">
      <input id="token-input" type="password" placeholder="API Token（如已配置）" autocomplete="off">
      <button id="token-save">保存 Token</button>
    </div>
  </header>

  <div id="wx-pop" class="hidden"></div>

  <main id="views">
    <section id="view-board" class="view active">
      <div class="board">
        <section class="bcard" id="card-today">
          <h2>今天 <span id="today-count"></span></h2>
          <div id="today-list"></div>
          <div id="today-more" class="scroll-hint hidden">往下滑看更多</div>
          <div id="today-done" class="done-line hidden"></div>
        </section>
        <div class="board-side">
          <section class="bcard" id="card-home">
            <h2>家里 <span id="home-note"></span></h2>
            <div id="home-list"></div>
          </section>
          <section class="bcard" id="card-recent">
            <h2>最近</h2>
            <div id="recent-list"></div>
          </section>
        </div>
      </div>
    </section>

    <section id="view-overview" class="view">
      <div class="view-inner">
        <h2 class="view-title">概览</h2>
        <div id="stat-cards" class="cards"></div>
        <div id="stat-detail" class="muted stat-detail"></div>
        <h3 class="section-title">到期提醒</h3>
        <div id="overview-due" class="list"></div>
        <h3 class="section-title">思考开关</h3>
        <div id="thinking-summary" class="muted stat-detail"></div>
        <div id="thinking-list" class="list"></div>
        <h3 class="section-title">最近打印</h3>
        <div id="printer-status" class="printer-line"></div>
        <div id="prints-list" class="list"></div>
        <h3 class="section-title">运行状态</h3>
        <div id="runtime-info" class="muted stat-detail"></div>
      </div>
    </section>

    <section id="view-data" class="view">
      <div class="view-inner">
        <h2 class="view-title">数据</h2>
        <div id="data-tabs" class="subtabs">
          <button class="subtab active" data-kind="memories" type="button">记忆</button>
          <button class="subtab" data-kind="items" type="button">物品</button>
          <button class="subtab" data-kind="tasks" type="button">任务</button>
          <button class="subtab" data-kind="facts" type="button">事实</button>
          <button class="subtab" data-kind="entities" type="button">实体</button>
        </div>
        <div class="data-toolbar">
          <input id="data-search" type="search" placeholder="搜索…" autocomplete="off">
          <select id="data-status" class="hidden"></select>
          <select id="data-sort" class="hidden"></select>
          <select id="data-size" title="每页条数">
            <option value="20">20 条/页</option>
            <option value="50">50 条/页</option>
            <option value="100">100 条/页</option>
          </select>
          <button id="data-refresh" class="small-btn" type="button">搜索</button>
        </div>
        <div id="data-list" class="list"></div>
        <div id="data-pager" class="pager">
          <button id="page-prev" class="small-btn" type="button">上一页</button>
          <span id="page-info" class="muted"></span>
          <button id="page-next" class="small-btn" type="button">下一页</button>
        </div>
      </div>
    </section>

    <section id="view-settings" class="view">
      <div class="view-inner">
        <h2 class="view-title">设置</h2>

        <div class="section-title">外观</div>
        <div class="card">
          <div class="muted">主题、背景只存在这台设备上，不影响别人看到的。</div>
          <div class="theme-grid" id="theme-grid">
            <button class="theme-chip" data-theme="warm" type="button"><span class="swatch" style="background:#faf4ea"></span>暖米</button>
            <button class="theme-chip" data-theme="clay" type="button"><span class="swatch" style="background:#f7e3d5"></span>陶土</button>
            <button class="theme-chip" data-theme="sage" type="button"><span class="swatch" style="background:#eef2e8"></span>鼠尾草</button>
            <button class="theme-chip" data-theme="night" type="button"><span class="swatch" style="background:#2b211d"></span>暖深</button>
          </div>
          <div class="kvline" style="margin-top:10px">
            <span class="k">19:00 后自动切暖深</span>
            <input type="checkbox" id="theme-auto">
          </div>
          <div class="bg-grid" id="bg-grid">
            <button class="bg-chip" data-bg="paper" type="button"><span class="paper" style="background:#faf4ea"></span>纯色纸底</button>
            <button class="bg-chip" data-bg="dawn" type="button"><span class="paper" style="background:linear-gradient(160deg,#fdf8f0,#f8e3cd 60%,#efd3b6)"></span>晨光渐变</button>
          </div>
        </div>

        <div class="section-title">系统配置</div>
        <div id="settings-summary" class="muted"></div>
        <div class="row-actions">
          <button id="token-change" class="small-btn" type="button">修改访问 Token</button>
        </div>
        <form id="settings-form"></form>
        <button id="settings-save" class="primary-btn" type="button">保存配置</button>
        <div id="settings-msg" class="muted"></div>

        <div class="section-title">提醒通知</div>
        <div class="card">
          <div id="push-status" class="muted">正在检查…</div>
          <div class="row-actions">
            <button id="push-enable" class="small-btn hidden" type="button">开启通知</button>
            <button id="push-disable" class="small-btn hidden" type="button">关闭通知</button>
            <button id="push-test" class="small-btn hidden" type="button">发测试通知</button>
          </div>
        </div>

        <div class="section-title">聊天记录</div>
        <div class="card">
          <div class="muted">只保存在这台设备上，最多保留最近 120 条；语音回复的播放按钮不会保留。</div>
          <div class="row-actions">
            <button id="clear-history" class="small-btn danger" type="button">清空聊天记录</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="dock">
    <button id="dock-mic" type="button"><span class="dot"></span>按住说话</button>
    <button id="dock-chat" type="button" aria-label="打开聊天" title="聊天">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.5A8 8 0 1 1 21 12z"/></svg>
    </button>
  </div>

  <nav id="tabs">
    <button class="tab active" data-tab="board" type="button">看板</button>
    <button class="tab" data-tab="overview" type="button">概览</button>
    <button class="tab" data-tab="data" type="button">数据</button>
    <button class="tab" data-tab="settings" type="button">设置</button>
  </nav>
</div>

<div id="chat-sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <button id="chat-back" type="button">‹ 看板</button>
      <span class="sheet-title">小马</span>
      <button id="chat-jump" type="button" title="跳到最新">↓</button>
    </div>
    <div id="messages"></div>
    <div id="task-chip" class="hidden">
      <span class="chip-label"></span>
      <button type="button" aria-label="取消任务绑定">✕</button>
    </div>
    <div id="file-chip" class="hidden">
      <span class="chip-label"></span>
      <button type="button" aria-label="取消文件">✕</button>
    </div>
    <div id="input-area">
      <button id="record-btn" aria-label="按住说话">
        <span id="record-label">按住说话</span>
        🎤
      </button>
      <input id="file-input" type="file" class="hidden"
             accept=".pdf,.txt,.md,.png,.jpg,.jpeg,.gif,.bmp,.webp,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
      <button id="attach-btn" type="button" aria-label="上传文件打印" title="上传文件打印">📎</button>
      <input id="text-input" type="text" placeholder="打字跟小马说话…" autocomplete="off">
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>

<div id="reminder-banner" class="hidden">
  <div class="rb-text"></div>
  <div class="rb-acts">
    <button data-act="complete" class="primary" type="button">办好了</button>
    <button data-act="postpone" type="button">挪明天</button>
    <button data-act="close" type="button">先不管</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 class="view-title">编辑任务</h3>
    <form id="task-edit-form">
      <input type="hidden" id="edit-task-id">
      <div class="field">
        <label>标题</label>
        <input id="edit-task-title" type="text">
      </div>
      <div class="field">
        <label>到期时间</label>
        <input id="edit-task-due" type="text" placeholder="YYYY-MM-DD">
      </div>
      <div class="field">
        <label>类型</label>
        <select id="edit-task-type">
          <option value="bill">账单</option>
          <option value="schedule">日程</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="row-actions">
        <button type="submit" class="small-btn">保存</button>
        <button type="button" id="modal-cancel" class="small-btn">取消</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---- DOM refs ----
  var msgBox     = document.getElementById('messages');
  var statusEl   = document.getElementById('status-text');
  var tokenInput = document.getElementById('token-input');
  var tokenRow   = document.getElementById('token-row');
  var tokenSave  = document.getElementById('token-save');
  var tokenChange = document.getElementById('token-change');
  var recBtn     = document.getElementById('record-btn');
  var recLabel   = document.getElementById('record-label');
  var textInput  = document.getElementById('text-input');
  var sendBtn    = document.getElementById('send-btn');
  var taskChip   = document.getElementById('task-chip');
  var taskChipLabel = taskChip.querySelector('.chip-label');
  var taskChipClose = taskChip.querySelector('button');
  var fileInput  = document.getElementById('file-input');
  var attachBtn  = document.getElementById('attach-btn');
  var fileChip   = document.getElementById('file-chip');
  var fileChipLabel = fileChip.querySelector('.chip-label');
  var fileChipClose = fileChip.querySelector('button');
  var pendingFile = null;   // 已上传、等这一轮发送的打印文件
  var uploadBusy = false;
  var tabs       = document.querySelectorAll('.tab');
  var views      = document.querySelectorAll('.view');
  var statCards  = document.getElementById('stat-cards');
  var statDetail = document.getElementById('stat-detail');
  var overviewDue = document.getElementById('overview-due');
  var thinkingSummary = document.getElementById('thinking-summary');
  var thinkingList = document.getElementById('thinking-list');
  var printsList = document.getElementById('prints-list');
  var printerStatus = document.getElementById('printer-status');
  var runtimeInfo = document.getElementById('runtime-info');
  var dataTabs   = document.getElementById('data-tabs');
  var dataList   = document.getElementById('data-list');
  var dataSearch = document.getElementById('data-search');
  var dataStatus = document.getElementById('data-status');
  var dataSort   = document.getElementById('data-sort');
  var dataSize   = document.getElementById('data-size');
  var dataRefresh = document.getElementById('data-refresh');
  var pagePrev   = document.getElementById('page-prev');
  var pageNext   = document.getElementById('page-next');
  var pageInfo   = document.getElementById('page-info');
  var modal      = document.getElementById('modal');
  var modalCancel = document.getElementById('modal-cancel');
  var taskEditForm = document.getElementById('task-edit-form');
  var editTaskId = document.getElementById('edit-task-id');
  var editTaskTitle = document.getElementById('edit-task-title');
  var editTaskDue = document.getElementById('edit-task-due');
  var editTaskType = document.getElementById('edit-task-type');
  var settingsForm = document.getElementById('settings-form');
  var settingsSave = document.getElementById('settings-save');
  var settingsSummary = document.getElementById('settings-summary');
  var settingsMsg = document.getElementById('settings-msg');
  var currentDataKind = 'memories';

  // 看板 / 聊天浮层 / 外观（D82）
  var clockEl    = document.getElementById('clock');
  var daylineEl  = document.getElementById('dayline');
  var wxBtn      = document.getElementById('wx-btn');
  var wxPop      = document.getElementById('wx-pop');
  var todayList  = document.getElementById('today-list');
  var todayCount = document.getElementById('today-count');
  var todayDone  = document.getElementById('today-done');
  var todayMore  = document.getElementById('today-more');
  var homeList   = document.getElementById('home-list');
  var homeNote   = document.getElementById('home-note');
  var recentList = document.getElementById('recent-list');
  var chatSheet  = document.getElementById('chat-sheet');
  var chatBack   = document.getElementById('chat-back');
  var chatJump   = document.getElementById('chat-jump');
  var dockMic    = document.getElementById('dock-mic');
  var dockChat   = document.getElementById('dock-chat');
  var reminderBanner = document.getElementById('reminder-banner');
  var themeGrid  = document.getElementById('theme-grid');
  var themeAuto  = document.getElementById('theme-auto');
  var bgGrid     = document.getElementById('bg-grid');

  // ---- iOS 主屏模式视口自愈 ----
  // iOS 26 standalone 下，键盘弹出过一次之后视口会永久缩水
  // （innerHeight / 100dvh 比 screen.height 少一截，底部留一条黑带），
  // 普通 resize / blur 都拉不回来。唯一的办法是在一个满屏高度元素上做一次
  // display 翻转，逼 WebKit 重新测量视口。
  var isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  var healFails = 0;
  var healDisabled = false;
  var lastHealAt = 0;

  function viewportShortfall() {
    if (!isStandalone) return 0;
    return Math.round(window.screen.height - window.innerHeight);
  }

  function healViewport() {
    if (healDisabled) return false;
    if (viewportShortfall() <= 4) return true;
    if (Date.now() - lastHealAt < 600) return false;
    lastHealAt = Date.now();

    var app = document.getElementById('app');
    if (!app) return false;
    var scrollTop = msgBox ? msgBox.scrollTop : 0;
    var prevDisplay = app.style.display;
    app.style.display = 'none';
    void app.offsetHeight;          // 同步重排，中间不绘制
    app.style.display = prevDisplay;
    if (msgBox) msgBox.scrollTop = scrollTop;

    var healed = viewportShortfall() <= 4;
    if (healed) {
      healFails = 0;
    } else if (++healFails >= 3) {
      // 翻转也救不回来，说明是系统层面裁掉了，别再让界面反复闪
      healDisabled = true;
    }
    return healed;
  }

  // 注意：自动触发只对「键盘把视口压小」的场景有效（iOS 17/18 可复现）。
  // 这台 iPhone 上是 iOS 26.1 的系统回归：竖屏 standalone 视口被永久裁掉 47pt，
  // 翻转也拉不回来（实测 797 → 797），所以不自动触发，避免白白闪屏；
  // 需要时在诊断面板里手动点「修复视口」。

  // ---- client id ----
  var CID_KEY = 'hst_client_id';
   var TOKEN_KEY = 'hst_api_token';
   var apiToken = localStorage.getItem(TOKEN_KEY) || '';
   tokenInput.value = apiToken;
   // 已存过 token 就先收起，等 pollStatus 确认有效后才算数（失败会再展开）
   if (apiToken) hideTokenRow(); else showTokenRow();
   tokenSave.addEventListener('click', function() {
     apiToken = tokenInput.value.trim();
     localStorage.setItem(TOKEN_KEY, apiToken);
     pollStatus();
     connectEvents();
     refreshPushUi();
   });
   tokenInput.addEventListener('keydown', function(e) {
     if (e.key === 'Enter') {
       e.preventDefault();
       tokenSave.click();
     }
   });

   function showTokenRow() {
     tokenRow.classList.remove('hidden');
   }

   function hideTokenRow() {
     tokenRow.classList.add('hidden');
   }

   tokenChange.addEventListener('click', function() {
     showTokenRow();
     tokenInput.focus();
     tokenInput.select();
     window.scrollTo({ top: 0, behavior: 'smooth' });
   });

   function authHeaders(extra) {
     var headers = extra || {};
     if (apiToken) headers.Authorization = 'Bearer ' + apiToken;
     return headers;
   }

   var clientId = localStorage.getItem(CID_KEY);
  if (!clientId) {
    clientId = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'c-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(CID_KEY, clientId);
  }

  // ---- helpers ----
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function apiFetch(path, options) {
    options = options || {};
    options.headers = authHeaders(options.headers || {});
    return fetch(path, options).then(function(r) {
      if (!r.ok) {
        // 任何接口遇到 401 都把 token 输入区亮出来，否则用户不知道去哪儿改
        if (r.status === 401) showTokenRow();
        throw new Error(String(r.status));
      }
      return r.json();
    });
  }

  // 把 fetch 错误翻译成用户能看懂的一句话（网络失败时 message 不是数字）
  function requestErrorText(err) {
    var status = Number(err && err.message);
    if (!status) return '连不上服务端，请检查网络或服务是否已启动';
    if (status === 401 || status === 403) return '访问令牌无效，请在顶部输入正确的令牌';
    if (status === 413) return '录音太长，请缩短后重试';
    if (status === 503) return '服务还在启动（首次要加载语音模型），请稍后再试';
    return '服务端返回错误（HTTP ' + status + '）';
  }

  function daysText(left) {
    if (left == null) return '';
    return left < 0 ? '已过期 ' + (-left) + ' 天' : '剩 ' + left + ' 天';
  }

  function scrollBottom() {
    requestAnimationFrame(function() { msgBox.scrollTop = msgBox.scrollHeight; });
  }

  // 轻量 Markdown：只处理加粗、行内代码和列表；先 esc 再替换，避免注入
  function inlineMd(text) {
    return esc(text)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function renderMarkdown(text) {
    var lines = String(text == null ? '' : text).split(/\r?\n/);
    var html = '';
    var inList = false;
    lines.forEach(function(line) {
      var item = /^\s*(?:[-*]|\d+[.)])\s+(.*)$/.exec(line);
      if (item) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inlineMd(item[1]) + '</li>';
        return;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim() === '') { html += '<br>'; return; }
      html += inlineMd(line) + '<br>';
    });
    if (inList) html += '</ul>';
    return html.replace(/(<br>)+$/, '');
  }

  // ---- 聊天记录（只存在本机，最多 120 条）----
  var CHAT_HISTORY_KEY = 'hst_chat_history';
  var CHAT_HISTORY_LIMIT = 120;
  var WELCOME_TEXT = '你好，我是小马，家里的记忆助手。按住说话，或者打字跟我聊。先试试这样用我：告诉我"酸奶8月5号过期"，我会记住；之后你随时问我"酸奶还有几天过期"，我就能答上来啦。';
  var chatHistory = loadChatHistory();

  function loadChatHistory() {
    try {
      var raw = localStorage.getItem(CHAT_HISTORY_KEY);
      var list = raw ? JSON.parse(raw) : [];
      return Object.prototype.toString.call(list) === '[object Array]' ? list : [];
    } catch (e) {
      return [];
    }
  }

  function saveChatHistory() {
    try {
      localStorage.setItem(
        CHAT_HISTORY_KEY,
        JSON.stringify(chatHistory.slice(-CHAT_HISTORY_LIMIT))
      );
    } catch (e) {
      // 存储满或被禁用：聊天照常，只是不保留
    }
  }

  function addMsg(text, type, audio, opts) {
    // type: 'user' | 'bot' | 'error'
    // opts: { persist: false } 临时消息不入库；{ reminder: true } 标记为通知原文
    opts = opts || {};
    var row = document.createElement('div');
    row.className = 'msg-row ' + type + (opts.reminder ? ' reminder' : '');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(text);

    if (audio) {
      var btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.textContent = '🔊 播放';
      btn.addEventListener('click', function() {
        // Must create Audio in user-gesture context for iOS Safari
        var a = new Audio('data:audio/mp3;base64,' + audio);
        a.play().catch(function() {});
      });
      bubble.appendChild(document.createElement('br'));
      bubble.appendChild(btn);
    }

    row.appendChild(bubble);
    msgBox.appendChild(row);
    scrollBottom();

    // 报错是临时提示（麦克风授权失败等），不入库
    if (type !== 'error' && opts.persist !== false) {
      chatHistory.push({
        text: text,
        type: type,
        reminder: !!opts.reminder,
        at: Date.now()
      });
      if (chatHistory.length > CHAT_HISTORY_LIMIT) {
        chatHistory = chatHistory.slice(-CHAT_HISTORY_LIMIT);
      }
      saveChatHistory();
    }
  }

  function renderWelcome() {
    addMsg(WELCOME_TEXT, 'bot', null, { persist: false });
  }

  function addTyping() {
    var row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-indicator';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    msgBox.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    var el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ---- tabs / overview / data / settings ----
  function switchTab(name) {
    tabs.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === name);
    });
    views.forEach(function(view) {
      view.classList.toggle('active', view.id === 'view-' + name);
    });
    if (name === 'board') loadBoard(false);
    if (name === 'overview') loadOverview();
    if (name === 'data') loadData(currentDataKind);
    if (name === 'settings') { loadConfig(); applyAppearance(); }
  }

  // ================= 看板（D82） =================
  // 聊天从「主界面」变成浮层：看板是稳态（今天要办什么、家里什么状态），
  // 聊天是瞬时动作。点气泡或按住说话才把它叫出来。

  var boardData = null;
  var boardWeather = null;
  var BOARD_REFRESH_MS = 60000;

  function two(n) { return (n < 10 ? '0' : '') + n; }

  function tickClock() {
    var now = new Date();
    if (clockEl) clockEl.textContent = two(now.getHours()) + ':' + two(now.getMinutes());
    if (daylineEl) {
      var week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()];
      daylineEl.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + week + ' · 小马';
    }
  }

  // ---- 外观：主题 / 背景都存本机 ----
  var THEME_KEY = 'hx_theme';
  var BG_KEY = 'hx_bg';
  var AUTO_NIGHT_KEY = 'hx_auto_night';
  var THEMES = ['warm', 'clay', 'sage', 'night'];

  function savedTheme() {
    var value = localStorage.getItem(THEME_KEY);
    return THEMES.indexOf(value) >= 0 ? value : 'warm';
  }

  function autoNightOn() {
    // 默认不自动切：用户选了暖米就该一直是暖米，想晚上变暗自己去设置里勾
    return localStorage.getItem(AUTO_NIGHT_KEY) === '1';
  }

  function effectiveTheme() {
    var hour = new Date().getHours();
    if (autoNightOn() && (hour >= 19 || hour < 7)) return 'night';
    return savedTheme();
  }

  function applyAppearance() {
    document.body.setAttribute('data-theme', effectiveTheme());
    document.body.setAttribute('data-bg', localStorage.getItem(BG_KEY) || 'dawn');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute('content', getComputedStyle(document.body).backgroundColor || '#faf4ea');
    }
    document.querySelectorAll('.theme-chip').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === savedTheme());
    });
    document.querySelectorAll('.bg-chip').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-bg') === (localStorage.getItem(BG_KEY) || 'dawn'));
    });
    if (themeAuto) themeAuto.checked = autoNightOn();
  }

  // ---- 今天：到期任务 + 过期物品 ----
  function daysLeftText(left) {
    if (left === null || left === undefined) return '';
    if (left === 0) return '今天到期';
    if (left < 0) return '逾期 ' + (-left) + ' 天';
    return '还有 ' + left + ' 天';
  }

  function whenText(due, left) {
    if (left < 0) return { text: '逾期', warn: true };
    var match = /T(\d{2}):(\d{2})/.exec(due || '');
    if (match && (match[1] !== '00' || match[2] !== '00')) {
      return { text: match[1] + ':' + match[2], warn: false };
    }
    return { text: '今天', warn: false };
  }

  function taskRow(task) {
    var when = whenText(task.due_at, task.days_left);
    var meta = daysLeftText(task.days_left);
    if (task.mode === 'soft') meta += ' · 聊天时顺口提';
    if (task.recur) meta += ' · ' + task.recur;
    return '<div class="brow">' +
      '<div class="bwhen' + (when.warn ? ' warn' : '') + '">' + esc(when.text) + '</div>' +
      '<div class="bbody">' +
        '<div class="btitle">' + esc(task.title) + '</div>' +
        '<div class="bmeta' + (task.days_left < 0 ? ' warn' : '') + '">' + esc(meta) + '</div>' +
        '<div class="bacts">' +
          '<button class="primary" data-act="task-complete" data-id="' + esc(task.id) + '" type="button">办好了</button>' +
          '<button data-act="task-postpone" data-id="' + esc(task.id) + '" type="button">挪明天</button>' +
          '<button data-act="task-cancel" data-id="' + esc(task.id) + '" type="button">不用了</button>' +
        '</div>' +
      '</div></div>';
  }

  function itemRow(item) {
    var when = item.days_left < 0 ? { text: '过期', warn: true } : { text: '今天', warn: false };
    return '<div class="brow">' +
      '<div class="bwhen' + (when.warn ? ' warn' : '') + '">' + when.text + '</div>' +
      '<div class="bbody">' +
        '<div class="btitle">' + esc(item.name) + '</div>' +
        '<div class="bmeta' + (item.days_left < 0 ? ' warn' : '') + '">' +
          esc(item.expiry_date || '') + ' · ' + esc(daysLeftText(item.days_left)) + '</div>' +
        '<div class="bacts">' +
          '<button data-act="item-delete" data-id="' + esc(item.id) + '" type="button">扔了</button>' +
        '</div>' +
      '</div></div>';
  }

  function renderToday(board) {
    var today = board.today || {};
    var tasks = today.tasks || [];
    var items = today.items || [];
    var overdue = 0;
    tasks.forEach(function(t) { if (t.days_left < 0) overdue++; });
    items.forEach(function(i) { if (i.days_left < 0) overdue++; });

    todayCount.textContent = (tasks.length + items.length) + ' 件' +
      (overdue ? ' · ' + overdue + ' 过期' : '');
    if (!tasks.length && !items.length) {
      todayList.innerHTML = '<div class="bempty">今天没什么事。有事直接按住说话。</div>';
    } else {
      todayList.innerHTML = tasks.map(taskRow).join('') + items.map(itemRow).join('');
    }

    var done = today.done || [];
    if (done.length) {
      todayDone.classList.remove('hidden');
      todayDone.textContent = '已办 ' + done.length + ' 件 · ' +
        done.slice(0, 3).map(function(t) { return t.title; }).join('、');
    } else {
      todayDone.classList.add('hidden');
    }
    // 卡片高度是限死的：条目多时提示还能往下滑，滑到底就收起来
    setTimeout(updateTodayHint, 0);
  }

  // 只在「确实还有内容没露出来」时提示，条数少的时候不出现多余的字
  function updateTodayHint() {
    if (!todayMore) return;
    var scrollable = todayList.scrollHeight - todayList.clientHeight > 4;
    var atBottom = todayList.scrollTop + todayList.clientHeight >= todayList.scrollHeight - 4;
    todayMore.classList.toggle('hidden', !scrollable || atBottom);
    todayList.classList.toggle('fading', scrollable && !atBottom);
  }

  // ---- 家里：门锁 / 室内 / 打印机，只放白名单设备 ----
  function findDevice(devices, keyword) {
    var hit = null;
    devices.forEach(function(device) {
      if (hit) return;
      if ((device.name || '').indexOf(keyword) >= 0) hit = device;
    });
    return hit;
  }

  function printerLine(printer) {
    if (!printer || printer.configured === false) return { text: '没配置', tone: '' };
    if (printer.enabled === false) return { text: '已关闭', tone: '' };
    if (printer.state === 'checking' || !printer.state) return { text: '检测中…', tone: '' };
    if (!printer.available) return { text: '不可用' + (printer.error ? ' · ' + printer.error : ''), tone: 'warn' };
    if (printer.state === 'printing') return { text: '正在打印' + (printer.jobs ? ' · 队列 ' + printer.jobs : ''), tone: 'ok' };
    return { text: '就绪', tone: 'ok' };
  }

  function kvRow(label, value, tone) {
    var tag = tone ? '<span class="tag ' + tone + '">' + esc(value) + '</span>'
                   : '<span class="v">' + esc(value) + '</span>';
    return '<div class="kvline"><span class="k">' + esc(label) + '</span>' + tag + '</div>';
  }

  function renderHome(board) {
    var home = board.home || {};
    var devices = home.devices || [];
    var rows = [];
    var attention = 0;

    if (home.configured === false) {
      rows.push('<div class="bempty">设备网关没配置（HOME_TOKEN），家里状态看不到</div>');
    } else if (home.error) {
      rows.push('<div class="bempty">' + esc(home.error) + '</div>');
    } else {
      var lock = findDevice(devices, '门锁状态') || findDevice(devices, '门锁');
      var battery = findDevice(devices, '电量');
      if (lock) {
        var lockText = String(lock.state || '未知');
        if (battery) lockText += ' · 电量 ' + battery.state + (battery.unit || '%');
        var lockWarn = /未关|虚掩|unknown|unavailable/i.test(String(lock.state || ''));
        if (lockWarn) attention++;
        rows.push(kvRow('门锁', lockText, lockWarn ? 'warn' : ''));
      }

      var temp = findDevice(devices, '室内温度');
      var humidity = findDevice(devices, '室内湿度');
      if (temp) {
        var indoor = temp.state + (temp.unit || '℃');
        if (humidity) indoor += ' · 湿度 ' + humidity.state + (humidity.unit || '%');
        // 灯不单独占行：全关或全离线时在室内这行末尾提一句就够
        if (lightsAllOff(devices)) indoor += ' · 灯全关着';
        rows.push(kvRow('室内', indoor, ''));
      }

      if (!rows.length) rows.push('<div class="bempty">还没配要看的设备（HOME_DEVICES）</div>');
    }

    var printer = printerLine(board.printer);
    rows.push(kvRow('打印机', printer.text, printer.tone));

    homeList.innerHTML = rows.join('');
    homeNote.textContent = attention ? attention + ' 个要留意' : '';
  }

  // 「灯全关着」只看灯的开关状态：全关或全离线（读不到）都算没开灯。
  // 有任意一盏开着就不说——灯不重要，别占地方。
  function lightsAllOff(devices) {
    var lights = devices.filter(function(device) {
      return device.domain === 'light';
    });
    if (!lights.length) return false;
    return lights.every(function(light) {
      return /^(off|unavailable|unknown|关闭|关)$/i.test(String(light.state || '').trim());
    });
  }

  // ---- 最近：最近的记忆 + 最近打印 ----
  function shortWhen(text) {
    var raw = String(text || '');
    var match = /^(\d{4})年(\d{1,2})月(\d{1,2})日\s*(\d{1,2}:\d{2})?/.exec(raw);
    if (!match) return raw;
    var now = new Date();
    var today = Number(match[1]) === now.getFullYear() &&
      Number(match[2]) === now.getMonth() + 1 && Number(match[3]) === now.getDate();
    var clock = match[4] || '';
    if (today) return clock ? '今天 ' + clock : '今天';
    return match[2] + '月' + match[3] + '日' + (clock ? ' ' + clock : '');
  }

  function renderRecent(board) {
    var recent = board.recent || {};
    var rows = [];
    (recent.memories || []).slice(0, 3).forEach(function(item) {
      var text = item.text || '';
      if (text.length > 26) text = text.slice(0, 26) + '…';
      rows.push('<div class="kvline"><span class="k" style="flex:1;overflow-wrap:anywhere">' +
        esc(text) + '</span><span class="v" style="flex:none">' + esc(shortWhen(item.time)) + '</span></div>');
    });
    // 打印记录在手机上只放一条：两条会把整页顶出 iPhone 12 的一屏
    var compact = window.matchMedia('(max-width: 899px)').matches;
    (recent.prints || []).slice(0, compact ? 1 : 2).forEach(function(job) {
      var status = PRINT_STATUS_TEXT[job.status] || '';
      rows.push('<div class="kvline"><span class="k" style="flex:1;overflow-wrap:anywhere">' +
        esc(job.name) + ' · ' + esc(status) + '</span>' +
        '<span class="v" style="flex:none">' + esc(fmtTime(job.created_at)) + '</span></div>');
    });
    if (!rows.length) rows.push('<div class="bempty">还没有记录。</div>');
    recentList.innerHTML = rows.join('');
  }

  // ---- 天气：顶栏一行，点开三天 ----
  var WX_ICONS = {
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>',
    cloud: '<svg viewBox="0 0 24 24"><path d="M6 18h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.2 4.4 4.4 0 0 0 6 18z"/></svg>',
    rain: '<svg viewBox="0 0 24 24"><path d="M6 15h11a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 6.2 4.4 4.4 0 0 0 6 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>'
  };

  function wxIcon(sky) {
    var text = String(sky || '');
    if (/雨|雪|雷/.test(text)) return WX_ICONS.rain;
    if (/云|阴|雾|霾/.test(text)) return WX_ICONS.cloud;
    return WX_ICONS.sun;
  }

  function dayLabel(date, index) {
    if (index === 0) return '今天';
    if (index === 1) return '明天';
    if (index === 2) return '后天';
    return (date || '').slice(5);
  }

  function renderWeather(weather) {
    boardWeather = weather;
    if (!weather || !weather.ok || !weather.now) {
      wxBtn.classList.add('hidden');
      wxPop.classList.add('hidden');
      return;
    }
    var now = weather.now;
    var today = (weather.days || [])[0] || {};
    var range = '';
    if (today.high != null && today.low != null) range = today.low + '° ~ ' + today.high + '°';
    var feels = now.feels != null ? '体感 ' + now.feels + '°' : '';
    var rain = '';
    if (today.pop != null) rain = '降水 ' + today.pop + '%';
    else if (today.precip_mm != null) rain = '降水 ' + today.precip_mm + ' 毫米';
    var wind = [now.wind_dir, now.wind_level].filter(Boolean).join(' ');
    var skyLine = [now.sky || '', feels].filter(Boolean).join(' · ');
    var rangeLine = [range, rain].filter(Boolean).join(' · ');

    wxBtn.classList.remove('hidden');

      '<span class="wx-temp">' + esc(now.temp != null ? now.temp + '°' : '') + '</span></span>' +
      '<span class="wx-sky">' + esc(skyLine) + '</span>' +
      (rangeLine ? '<span class="wx-range">' + esc(rangeLine) + '</span>' : '') +
      (wind ? '<span class="wx-wind">' + esc(wind) + '</span>' : '');

    var days = (weather.days || []).slice(0, 3).map(function(day, index) {
      var rain = '';
      if (day.pop != null) rain = '降水 ' + day.pop + '%';
      else if (day.precip_mm) rain = '降水 ' + day.precip_mm + ' 毫米';
      return '<div class="wx-day"><b>' + esc(dayLabel(day.date, index)) + '</b>' +
        esc(day.sky || '') + ' <span class="hi">' + esc(day.high != null ? day.high + '°' : '') + '</span>' +
        (day.low != null ? ' / ' + esc(day.low + '°') : '') +

      ' · 更新 ' + esc(String(now.updated_at || '').slice(11, 16)) + '</span><span>点外面收起</span></div>' +
      '<div class="wx-days">' + days + '</div>';

  // ---- 打印历史（D65）：重启后也能看到打过什么，点一下再打一份 ----

  var PRINT_STATUS_TEXT = {
    ready: '待打印', printing: '打印中', printed: '已打印',
    failed: '失败', cancelled: '已取消'
  };

  function fmtUptime(seconds) {
    if (!seconds || seconds < 0) return '刚刚启动';
    if (seconds < 3600) return Math.max(1, Math.round(seconds / 60)) + ' 分钟';
    if (seconds < 86400) {
      return Math.floor(seconds / 3600) + ' 小时 ' +
        Math.round((seconds % 3600) / 60) + ' 分';
    }
    return Math.floor(seconds / 86400) + ' 天 ' +
      Math.floor((seconds % 86400) / 3600) + ' 小时';
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    function two(n) { return (n < 10 ? '0' : '') + n; }
    return (d.getMonth() + 1) + '-' + two(d.getDate()) + ' ' +
      two(d.getHours()) + ':' + two(d.getMinutes());
  }

  // 打印机状态（D61 补充）：概览页先看能不能打，别等传完文件才报错。
  // 服务端状态有 30 秒缓存，「重查」按钮用 refresh=1 绕过它。
  function loadPrinterStatus(refresh) {
    if (!printerStatus) return;
    // 断电时这次请求要等 CUPS 超时，先给一句，别看起来像没反应
    if (refresh) printerStatus.textContent = '正在检测打印机…';
    apiFetch('/api/printer' + (refresh ? '?refresh=1' : '')).then(function(d) {
      if (!d.configured) { printerStatus.textContent = ''; return; }
      if (d.state === 'checking') {
        // 服务端在后台问 CUPS（打印机断电时要等超时），先给一句，过几秒再来取
        printerStatus.textContent = '正在检测打印机…';
        setTimeout(function() { loadPrinterStatus(); }, 2500);
        return;
      }
      var state = d.available
        ? (d.state === 'printing' ? '正在打印' : '在线')
        : '不可用';
      var parts = ['打印机 ' + (d.queue || d.name || '默认队列') + '：' + state];
      if (d.available && d.jobs) parts.push('队列里 ' + d.jobs + ' 份');
      if (d.error) parts.push(d.error);
      printerStatus.innerHTML =
        '<span class="printer-dot ' + (d.available ? 'on' : 'off') + '"></span>' +
        esc(parts.join(' · ')) +
        ' <button id="printer-refresh" class="small-btn" type="button">重查</button>';
      var btn = document.getElementById('printer-refresh');
      if (btn) btn.addEventListener('click', function() { loadPrinterStatus(true); });
      // 服务端返回旧值并在后台更新时，隔几秒再拉一次，别让页面一直显示旧状态
      if (d.stale) setTimeout(function() { loadPrinterStatus(); }, 3000);
    }).catch(function() {
      printerStatus.textContent = '';
    });
  }

  function loadPrints() {
    if (!printsList) return;
    apiFetch('/api/prints?limit=5').then(function(d) {
      var rows = d.items || [];
      if (!rows.length) {
        printsList.innerHTML = '<div class="empty">还没有打印记录。</div>';
        return;
      }
      printsList.innerHTML = rows.map(function(it) {
        var meta = [PRINT_STATUS_TEXT[it.status] || it.status, fmtTime(it.created_at)];
        if (it.copies > 1) meta.push(it.copies + ' 份');
        if (it.pages) meta.push(it.pages + ' 页');
        if (it.job_id) meta.push(it.job_id);
        if (it.status === 'failed' && it.error) meta.push(it.error);
        var action = it.status === 'printing' ? '' :
          '<div class="row-actions"><button type="button" class="small-btn" ' +
          'data-reprint="' + esc(it.id) + '">再打一份</button></div>';
        return '<div class="list-row">' + esc(it.name) +
          '<div class="meta">' + esc(meta.join(' · ')) + '</div>' + action + '</div>';
      }).join('');
    }).catch(function(err) {
      printsList.innerHTML =
        '<div class="empty">加载失败：' + esc(requestErrorText(err)) + '</div>';
    });
  }

  var DELETE_ENDPOINTS = {

  var DATA_STATUS_OPTIONS = {

    tasks: [['', '全部状态'], ['pending', '待办'], ['reminded', '已提醒'], ['done', '已完成'], ['cancelled', '已取消']]

  var DATA_SORT_OPTIONS = {

    items: '还没有物品。对小马说「牛奶下周三过期」，它会记进清单并按时提醒。',

  // 周期任务在列表里说清是哪一种，别只显示下一次的时间
  function recurLabel(task) {
    var recur = (task && task.recur) || '';
    if (!recur) return '';
    if (recur === 'daily') return '每天';
    var dateText = ((task && task.due_at) || '').slice(0, 10);
    var moment = new Date(dateText + 'T00:00:00');
    if (isNaN(moment.getTime())) return '';
    if (recur === 'weekly') return '每周' + '日一二三四五六'[moment.getDay()];
    if (recur === 'monthly') return '每月' + moment.getDate() + '号';
    return '';
  }

  var ENTITY_LABELS = {
    property: '住所', person: '家庭成员', product: '物品',
    provider: '缴费单位', place: '地点', device: '设备'
  };

  var dataState = {
    kind: 'memories', q: '', status: '', sort: '',
    limit: 20, offset: 0, total: 0
  };
  var lastData = {};

  function configureDataStatus(kind) {
    var options = DATA_STATUS_OPTIONS[kind];
    if (!options) {
      dataStatus.classList.add('hidden');
      dataStatus.innerHTML = '';
      dataStatus.value = '';
      return;
    }
    dataStatus.classList.remove('hidden');
    dataStatus.innerHTML = options.map(function(option) {
      return '<option value="' + esc(option[0]) + '">' + esc(option[1]) + '</option>';
    }).join('');
    dataStatus.value = '';
  }

  function configureDataSort(kind) {
    var options = DATA_SORT_OPTIONS[kind];
    if (!options) {
      dataSort.classList.add('hidden');
      dataSort.innerHTML = '';
      dataSort.value = '';
      return;
    }
    dataSort.classList.remove('hidden');
    dataSort.innerHTML = options.map(function(option) {
      return '<option value="' + esc(option[0]) + '">' + esc(option[1]) + '</option>';
    }).join('');
    dataSort.value = options[0][0];
  }

  function loadData(kind, reset) {
    if (kind !== dataState.kind) {
      dataState.kind = kind;
      dataState.q = '';
      dataState.status = '';
      dataState.sort = '';
      dataState.offset = 0;
      dataSearch.value = '';
      configureDataStatus(kind);
      configureDataSort(kind);
    }
    if (reset) dataState.offset = 0;

    currentDataKind = kind;
    dataTabs.querySelectorAll('.subtab').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-kind') === kind);
    });

    dataState.q = dataSearch.value.trim();
    dataState.status = dataStatus.value || '';
    dataState.sort = dataSort.value || '';

    var params = new URLSearchParams();
    params.set('limit', String(dataState.limit));
    params.set('offset', String(dataState.offset));
    if (dataState.q) params.set('q', dataState.q);
    if (dataState.status) params.set('status', dataState.status);
    if (dataState.sort) params.set('sort', dataState.sort);

    apiFetch(DATA_ENDPOINTS[kind] + '?' + params.toString()).then(function(d) {
      dataState.total = d.total || 0;
      if (dataState.offset > 0 && dataState.offset >= dataState.total) {
        dataState.offset = Math.max(0, dataState.offset - dataState.limit);
        return loadData(kind);
      }
      lastData = d;
      renderData(kind, d);
      renderPager();
    }).catch(function(err) {
      dataList.innerHTML = '<div class="empty">加载失败：' + esc(requestErrorText(err)) + '</div>';
    });
  }

  function renderPager() {
    var pages = Math.max(1, Math.ceil(dataState.total / dataState.limit));
    var page = Math.floor(dataState.offset / dataState.limit) + 1;
    pageInfo.textContent = '第 ' + page + ' / ' + pages + ' 页 · 共 ' + dataState.total + ' 条';
    pagePrev.disabled = dataState.offset <= 0;
    pageNext.disabled = dataState.offset + dataState.limit >= dataState.total;
  }

  function deleteButton(kind, id) {
    return '<button class="small-btn danger" data-delete-kind="' + esc(kind) +
      '" data-delete-id="' + esc(id) + '">删除</button>';
  }

  function renderData(kind, data) {
    var rows = [];
    if (kind === 'memories') {
      (data.memories || []).forEach(function(m) {
        rows.push('<div class="list-row">' + esc(m.text) +
          '<div class="meta">' + esc(m.time) +
          (m.summary ? ' · ' + esc(m.summary) : '') +
          '</div><div class="row-actions">' + deleteButton('memories', m.id) + '</div></div>');
      });
    } else if (kind === 'items') {
      (data.items || []).forEach(function(item) {
        rows.push('<div class="list-row">' + esc(item.name) +
          '<div class="meta">到期 ' + esc(item.expiry_date || '未知') +
          ' · ' + esc(STATUS_LABELS[item.status] || item.status) + '</div>' +
          '<div class="row-actions">' + deleteButton('items', item.id) + '</div></div>');
      });
    } else if (kind === 'tasks') {
      (data.tasks || []).forEach(function(task) {
        var actions = '<div class="row-actions">';
        if (task.status === 'pending' || task.status === 'reminded') {
          actions += '<button class="small-btn" data-task-id="' + esc(task.id) + '" data-action="complete">完成</button>';
          actions += '<button class="small-btn danger" data-task-id="' + esc(task.id) + '" data-action="cancel">取消</button>';
        }
        actions += '<button class="small-btn" data-edit-task="' + esc(task.id) + '">编辑</button>';
        actions += deleteButton('tasks', task.id);
        actions += '</div>';
        rows.push('<div class="list-row">#' + esc(task.id) + ' ' + esc(task.title) +
          '<div class="meta">' + esc(task.due_at || '未定') +
          ' · ' + esc(STATUS_LABELS[task.status] || task.status) +
          (task.recur ? ' · ' + esc(recurLabel(task)) : '') + '</div>' + actions + '</div>');
      });
    } else if (kind === 'facts') {
      (data.facts || []).forEach(function(fact) {
        rows.push('<div class="list-row">' + esc(fact.subject) + ' · ' +
          esc(fact.predicate) + '：' + esc(fact.value) +
          (fact.source ? '<div class="meta">来源：' + esc(fact.source) + '</div>' : '') +
          '<div class="row-actions">' + deleteButton('facts', fact.id) + '</div></div>');
      });
    } else if (kind === 'entities') {
      (data.entities || []).forEach(function(entity) {
        var aliases = (entity.aliases || []).join('、');
        rows.push('<div class="list-row">' + esc(entity.canonical_name) +
          '<div class="meta">' + esc(ENTITY_LABELS[entity.type] || entity.type) +
          (aliases ? ' · 别名：' + esc(aliases) : '') + '</div></div>');
      });
    }
    dataList.innerHTML = rows.length ? rows.join('') : emptyState(kind);
  }

  function emptyState(kind) {
    var filtered = dataState.q || dataState.status;
    if (filtered) {
      var parts = [];
      if (dataState.q) parts.push('「' + dataState.q + '」');
      if (dataState.status) parts.push(STATUS_LABELS[dataState.status] || dataState.status);
      return '<div class="empty">没有符合 ' + esc(parts.join(' / ')) +
        ' 的记录。<button class="small-btn" type="button" id="empty-clear">清除筛选</button></div>';
    }
    return '<div class="empty">' + esc(EMPTY_HINTS[kind] || '暂无数据') + '</div>';
  }

  // ---- Web Push 提醒通知 ----
  var pushStatus = document.getElementById('push-status');

  function pushSupported() {
    return ('serviceWorker' in navigator) && ('PushManager' in window) &&
      ('Notification' in window);
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var raw = atob(base64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function pushHint() {
    if (!pushSupported()) return '这个浏览器不支持推送通知。';
    if (!isStandalone) return 'iPhone 上要先「添加到主屏幕」，从图标打开后才能开通知。';
    if (Notification.permission === 'denied') {
      return '通知权限被拒绝：请到 设置 → 通知 → 小马 里重新允许。';
    }
    return '';
  }

  // 把公钥和 Token 写进 IndexedDB：SW 处理 pushsubscriptionchange 时需要，
  // 那时页面通常没开着。关掉通知时清掉。
  function pushIdbOpen() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open('xiaoma-push', 1);
      req.onupgradeneeded = function() {
        var db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }

  function storePushConfig(publicKey) {
    if (!publicKey || !apiToken) return;
    pushIdbOpen().then(function(db) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put({ publicKey: publicKey, token: apiToken }, 'config');
    }).catch(function() { /* 存不了只是失去自动重订阅，不影响当前订阅 */ });
  }

  function clearPushConfig() {
    pushIdbOpen().then(function(db) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete('config');
    }).catch(function() {});
  }

  // ---- 点系统通知进来：把通知原文显示在聊天里 ----
  var lastReminderAt = 0;

  // ---- 当前绑定的提醒任务：从通知/卡片点进来后，下一轮对话带上 task_id ----
  var activeTask = null;
  var activeTaskTimer = null;
  var taskCards = {};
  var TASK_BIND_MS = 10 * 60 * 1000;

  function bindTask(id, title) {
    var tid = parseInt(id, 10);
    if (!tid) return;
    activeTask = { id: tid, title: title || ('任务 #' + tid) };
    taskChipLabel.textContent = '正在处理：' + activeTask.title;
    taskChip.classList.remove('hidden');
    if (activeTaskTimer) clearTimeout(activeTaskTimer);
    activeTaskTimer = setTimeout(clearTask, TASK_BIND_MS);
  }

  function clearTask() {
    activeTask = null;
    if (activeTaskTimer) { clearTimeout(activeTaskTimer); activeTaskTimer = null; }
    taskChip.classList.add('hidden');
  }

  taskChipClose.addEventListener('click', clearTask);

  // 说话/打字把任务处理完之后，卡片和绑定条要跟着更新——不靠猜模型说了什么，
  // 而是回查一次任务列表，以库里的状态为准（查不到就不动，避免误标）。
  function refreshBoundTask() {
    if (!activeTask) return;
    var id = activeTask.id;
    apiFetch('/api/tasks?limit=100').then(function(res) {
      var rows = (res && res.tasks) || [];
      var found = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].id === id) { found = rows[i]; break; }
      }
      if (!found) return;
      if (found.status === 'done' || found.status === 'cancelled') {
        var card = taskCards[id];
        if (card) card.finish(found.status === 'done' ? '已完成' : '已取消');
        clearTask();
      }
    }).catch(function() { /* 查不到状态就先留着绑定 */ });
  }

  function showLastReminder(force) {
    return pushIdbOpen().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction('kv', 'readonly');
        var req = tx.objectStore('kv').get('last');
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
      });
    }).then(function(payload) {
      if (!payload || !payload.body) return;
      if (!force && payload.at && payload.at === lastReminderAt) return;
      lastReminderAt = payload.at || Date.now();
      switchTab('chat');
      addMsg(payload.body, 'bot', null, { reminder: true });
      // 点了这条通知，后面一句「完成了 / 延到周五」就指这条任务
      if (payload.taskId) bindTask(payload.taskId, payload.taskTitle || payload.body);
    }).catch(function() { /* 没有存过通知就什么都不做 */ });
  }

  function showPushButtons(canEnable, subscribed) {
    pushEnable.classList.toggle('hidden', !canEnable);
    pushDisable.classList.toggle('hidden', !subscribed);
    pushTest.classList.toggle('hidden', !subscribed);
  }

  function refreshPushUi() {
    if (!pushSupported()) {
      pushStatus.textContent = pushHint();
      showPushButtons(false, false);
      return;
    }
    apiFetch('/api/push/key').then(function(key) {
      if (!key.enabled) {
        pushStatus.textContent =
          '服务端未配置推送密钥（.env 的 PUSH_ENABLED / VAPID_*），' +
          '提醒仍只会在页面打开时出现。';
        showPushButtons(false, false);
        return null;
      }
      return navigator.serviceWorker.ready
        .then(function(reg) { return reg.pushManager.getSubscription(); })
        .then(function(sub) {
          if (sub) {
            storePushConfig(key.publicKey);
            pushStatus.textContent = '通知已开启：App 关着也能收到到期提醒。';
            showPushButtons(false, true);
          } else {
            pushStatus.textContent = pushHint() ||
              '通知未开启。开启后即使 App 关着也能收到到期提醒。';
            showPushButtons(true, false);
          }
        });
    }).catch(function(err) {
      pushStatus.textContent = '检查推送状态失败：' + requestErrorText(err);
    });
  }

  pushEnable.addEventListener('click', function() {
    pushEnable.disabled = true;
    var subKey = null;
    apiFetch('/api/push/key').then(function(key) {
      if (!key.enabled || !key.publicKey) throw new Error('服务端未配置推送密钥');
      subKey = key.publicKey;
      return Notification.requestPermission();
    }).then(function(permission) {
      if (permission !== 'granted') throw new Error('通知权限未授予');
      return navigator.serviceWorker.ready;
    }).then(function(reg) {
      return reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(subKey)
      });
    }).then(function(sub) {
      var json = sub.toJSON();
      return apiFetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          endpoint: json.endpoint,
          keys: json.keys,
          user_agent: navigator.userAgent
        })
      });
    }).then(function() {
      storePushConfig(subKey);
      refreshPushUi();
    }).catch(function(err) {
      pushStatus.textContent = '开启失败：' +
        (err && err.message ? err.message : requestErrorText(err));
    }).then(function() {
      pushEnable.disabled = false;
    });
  });

  pushDisable.addEventListener('click', function() {
    pushDisable.disabled = true;
    navigator.serviceWorker.ready
      .then(function(reg) { return reg.pushManager.getSubscription(); })
      .then(function(sub) {
        if (!sub) return null;
        var endpoint = sub.endpoint;
        return sub.unsubscribe().then(function() {
          return apiFetch('/api/push/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: endpoint })
          });
        });
      })
      .then(function() {
        clearPushConfig();
        refreshPushUi();
      })
      .catch(function(err) {
        pushStatus.textContent = '关闭失败：' + requestErrorText(err);
      })
      .then(function() {
        pushDisable.disabled = false;

  function pollStatus() {
    fetch('/api/status', { headers: authHeaders() })
      .then(function(r) {
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function(d) {
        if (d.ok) {
          var txt = '服务正常 · 记忆 ' + (d.memory_count != null ? d.memory_count : '?') + ' 条';
          if (d.item_count != null) txt += ' · 物品 ' + d.item_count + ' 件';
          if (d.task_count != null) txt += ' · 任务 ' + d.task_count + ' 个';
          statusEl.textContent = txt;
          statusEl.setAttribute('data-ok', '1');
          // 到期的具体事项由看板「今天」那张卡负责，这里不再重复念一遍
          if (document.getElementById('view-board').classList.contains('active')) {
            loadBoard(false);
