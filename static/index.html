<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>家庭智能终端 · 小马</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1b1f2a">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小马">
<style>
:root {
  --bg: #1b1f2a;
  --surface: #252a38;
  --surface-alt: #2d3348;
  --user-bubble: #3a7bd5;
  --user-text: #fff;
  --bot-bubble: #2e3448;
  --bot-text: #e4e8f1;
  --text-primary: #e8ecf4;
  --text-secondary: #8b93a8;
  --accent: #5b9cf5;
  --danger: #e85d5d;
  --input-bg: #2a2f40;
  --border: #3a4058;
  --record-active: #d94040;
  --radius: 14px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  /* iOS 主屏模式（standalone）下 100% 只算到安全区上方，底部会多出一条黑边，
     用 dvh 覆盖整个可视区域；-webkit-fill-available 兜底旧系统 */
  height: 100%;
  height: -webkit-fill-available;
  height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex; flex-direction: column;
  /* 用 body 的高度（100dvh，包含底部安全区）铺满，不要用 innerHeight：
     iOS standalone 下 innerHeight 会比 screen.height 少一截，锁死它会留黑边 */
  height: 100%;
  max-width: 600px; margin: 0 auto;
}

/* ---- status bar ---- */
#status-bar {
  flex-shrink: 0; padding: calc(16px + env(safe-area-inset-top)) 20px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
#status-bar h1 {
  font-size: 18px; font-weight: 700; letter-spacing: .5px;
  color: var(--text-primary);
}
#status-bar .sub {
  margin-top: 4px; font-size: 13px; color: var(--text-secondary);
}
#token-row {
  display: flex; gap: 8px; margin-top: 10px;
}
#token-input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
#token-save {
  height: 34px; padding: 0 12px; border: none;
  border-radius: var(--radius-sm); background: var(--accent); color: #fff;
}

/* ---- messages ---- */
#messages {
  flex: 1; overflow-y: auto; padding: 16px 16px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg-row { display: flex; margin-bottom: 12px; }
.msg-row.user { justify-content: flex-end; }
.msg-row.bot  { justify-content: flex-start; }
.msg-row.error { justify-content: center; }

.bubble {
  max-width: 80%; padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px; line-height: 1.55;
  word-break: break-word;
  position: relative;
}
.msg-row.user .bubble {
  background: var(--user-bubble); color: var(--user-text);
  border-bottom-right-radius: 4px;
}
.msg-row.bot .bubble {
  background: var(--bot-bubble); color: var(--bot-text);
  border-bottom-left-radius: 4px;
}
.msg-row.error .bubble {
  background: rgba(232,93,93,.15); color: var(--danger);
  font-size: 14px; max-width: 90%; text-align: center;
}
/* 从系统通知点进来时的那条提醒，和普通对话区分开 */
.msg-row.reminder .bubble {
  border: 1px solid var(--accent);
  background: rgba(91,156,245,.12);
}

/* 轻量 Markdown 渲染后的元素 */
.bubble ul { margin: 4px 0; padding-left: 18px; }
.bubble li { margin: 2px 0; }
.bubble strong { font-weight: 700; }
.bubble code {
  padding: 1px 4px; border-radius: 4px;
  background: rgba(255,255,255,.10);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
}

.play-btn {
  display: inline-block; margin-top: 6px;
  padding: 4px 10px; font-size: 13px;
  background: var(--surface-alt); color: var(--accent);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; user-select: none;
  transition: background .15s;
}
.play-btn:active { background: var(--border); }

/* ---- tabs / views ---- */
#tabs {
  flex-shrink: 0; display: flex; gap: 4px;
  padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1; height: 34px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-secondary);
  font-size: 14px; cursor: pointer;
}
.tab.active { background: var(--surface-alt); color: var(--text-primary); font-weight: 600; }
#views { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.active { display: flex; flex-direction: column; }
.view-inner { flex: 1; overflow-y: auto; padding: 16px; }
.view-title { font-size: 18px; margin-bottom: 14px; }
.section-title { font-size: 14px; color: var(--text-secondary); margin: 18px 0 8px; }
.muted { color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
}
.card .num { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.card .label { margin-top: 4px; font-size: 12px; color: var(--text-secondary); }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; line-height: 1.5;
}
.list-row .meta { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
.row-actions { display: flex; gap: 8px; margin-top: 8px; }
.small-btn {
  padding: 5px 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface-alt);
  color: var(--accent); font-size: 12px; cursor: pointer;
}
.small-btn.danger { color: var(--danger); }
.empty { color: var(--text-secondary); font-size: 13px; padding: 10px 0; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.subtab {
  padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 999px; background: transparent;
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
}
.subtab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
.field input {
  width: 100%; height: 38px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.primary-btn {
  width: 100%; height: 42px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 4px;
}
.hidden { display: none !important; }
.data-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
.data-toolbar input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.data-toolbar select {
  height: 34px; padding: 0 8px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.pager {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 14px;
}
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(0, 0, 0, .55);
}
.modal-card {
  width: min(100%, 420px); padding: 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.modal-card select {
  width: 100%; height: 38px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}

/* ---- input area ---- */
#input-area {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
}

#record-btn {
  width: 56px; height: 56px; flex-shrink: 0;
  border-radius: 50%; border: none;
  background: var(--accent); color: #fff;
  font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
  user-select: none; position: relative;
}
#record-btn.recording {
  background: var(--record-active);
  transform: scale(1.08);
}
#record-btn:disabled {
  opacity: .5; cursor: not-allowed;
}

#record-label {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; white-space: nowrap;
  color: var(--record-active); font-weight: 600;
  opacity: 0; transition: opacity .15s;
  pointer-events: none;
}
#record-btn.recording #record-label { opacity: 1; }

#text-input {
  flex: 1; height: 44px; padding: 0 14px;
  font-size: 16px; /* >=16px to prevent iOS zoom */
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 22px;
  outline: none;
  transition: border-color .15s;
}
#text-input::placeholder { color: var(--text-secondary); }
#text-input:focus { border-color: var(--accent); }

#send-btn {
  height: 44px; padding: 0 18px; flex-shrink: 0;
  border-radius: 22px; border: none;
  background: var(--accent); color: #fff;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
#send-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---- typing indicator ---- */
.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-secondary);
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
</style>
</head>
<body>

<div id="app">
  <div id="status-bar">
    <h1>家庭智能终端 · 小马</h1>
    <div class="sub" id="status-text">正在连接…</div>
    <div id="token-row">
      <input id="token-input" type="password" placeholder="API Token（如已配置）" autocomplete="off">
      <button id="token-save">保存 Token</button>
    </div>
  </div>

  <nav id="tabs">
    <button class="tab active" data-tab="chat" type="button">聊天</button>
    <button class="tab" data-tab="overview" type="button">概览</button>
    <button class="tab" data-tab="data" type="button">数据</button>
    <button class="tab" data-tab="settings" type="button">设置</button>
  </nav>

  <main id="views">
    <section id="view-chat" class="view active">
      <div id="messages"></div>
      <div id="input-area">
        <button id="record-btn" aria-label="按住说话">
          <span id="record-label">按住说话</span>
          🎤
        </button>
        <input id="text-input" type="text" placeholder="打字跟小马说话…" autocomplete="off">
        <button id="send-btn">发送</button>
      </div>
    </section>

    <section id="view-overview" class="view">
      <div class="view-inner">
        <h2 class="view-title">概览</h2>
        <div id="stat-cards" class="cards"></div>
        <h3 class="section-title">到期提醒</h3>
        <div id="overview-due" class="list"></div>
      </div>
    </section>

    <section id="view-data" class="view">
      <div class="view-inner">
        <h2 class="view-title">数据</h2>
        <div id="data-tabs" class="subtabs">
          <button class="subtab active" data-kind="memories" type="button">记忆</button>
          <button class="subtab" data-kind="items" type="button">物品</button>
          <button class="subtab" data-kind="tasks" type="button">任务</button>
          <button class="subtab" data-kind="facts" type="button">事实</button>
          <button class="subtab" data-kind="entities" type="button">实体</button>
        </div>
        <div class="data-toolbar">
          <input id="data-search" type="search" placeholder="搜索…" autocomplete="off">
          <select id="data-status" class="hidden"></select>
          <button id="data-refresh" class="small-btn" type="button">搜索</button>
        </div>
        <div id="data-list" class="list"></div>
        <div id="data-pager" class="pager">
          <button id="page-prev" class="small-btn" type="button">上一页</button>
          <span id="page-info" class="muted"></span>
          <button id="page-next" class="small-btn" type="button">下一页</button>
        </div>
      </div>
    </section>

    <section id="view-settings" class="view">
      <div class="view-inner">
        <h2 class="view-title">系统配置</h2>
        <div id="settings-summary" class="muted"></div>
        <form id="settings-form"></form>
        <button id="settings-save" class="primary-btn" type="button">保存配置</button>
        <div id="settings-msg" class="muted"></div>

        <div class="section-title">提醒通知</div>
        <div class="card">
          <div id="push-status" class="muted">正在检查…</div>
          <div class="row-actions">
            <button id="push-enable" class="small-btn hidden" type="button">开启通知</button>
            <button id="push-disable" class="small-btn hidden" type="button">关闭通知</button>
            <button id="push-test" class="small-btn hidden" type="button">发测试通知</button>
          </div>
        </div>

        <div class="section-title">聊天记录</div>
        <div class="card">
          <div class="muted">只保存在这台设备上，最多保留最近 120 条；语音回复的播放按钮不会保留。</div>
          <div class="row-actions">
            <button id="clear-history" class="small-btn danger" type="button">清空聊天记录</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 class="view-title">编辑任务</h3>
    <form id="task-edit-form">
      <input type="hidden" id="edit-task-id">
      <div class="field">
        <label>标题</label>
        <input id="edit-task-title" type="text">
      </div>
      <div class="field">
        <label>到期时间</label>
        <input id="edit-task-due" type="text" placeholder="YYYY-MM-DD">
      </div>
      <div class="field">
        <label>类型</label>
        <select id="edit-task-type">
          <option value="bill">账单</option>
          <option value="schedule">日程</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="row-actions">
        <button type="submit" class="small-btn">保存</button>
        <button type="button" id="modal-cancel" class="small-btn">取消</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---- DOM refs ----
  var msgBox     = document.getElementById('messages');
  var statusEl   = document.getElementById('status-text');
  var tokenInput = document.getElementById('token-input');
  var tokenSave  = document.getElementById('token-save');
  var recBtn     = document.getElementById('record-btn');
  var recLabel   = document.getElementById('record-label');
  var textInput  = document.getElementById('text-input');
  var sendBtn    = document.getElementById('send-btn');
  var tabs       = document.querySelectorAll('.tab');
  var views      = document.querySelectorAll('.view');
  var statCards  = document.getElementById('stat-cards');
  var overviewDue = document.getElementById('overview-due');
  var dataTabs   = document.getElementById('data-tabs');
  var dataList   = document.getElementById('data-list');
  var dataSearch = document.getElementById('data-search');
  var dataStatus = document.getElementById('data-status');
  var dataRefresh = document.getElementById('data-refresh');
  var pagePrev   = document.getElementById('page-prev');
  var pageNext   = document.getElementById('page-next');
  var pageInfo   = document.getElementById('page-info');
  var modal      = document.getElementById('modal');
  var modalCancel = document.getElementById('modal-cancel');
  var taskEditForm = document.getElementById('task-edit-form');
  var editTaskId = document.getElementById('edit-task-id');
  var editTaskTitle = document.getElementById('edit-task-title');
  var editTaskDue = document.getElementById('edit-task-due');
  var editTaskType = document.getElementById('edit-task-type');
  var settingsForm = document.getElementById('settings-form');
  var settingsSave = document.getElementById('settings-save');
  var settingsSummary = document.getElementById('settings-summary');
  var settingsMsg = document.getElementById('settings-msg');
  var currentDataKind = 'memories';

  // ---- iOS 主屏模式视口自愈 ----
  // iOS 26 standalone 下，键盘弹出过一次之后视口会永久缩水
  // （innerHeight / 100dvh 比 screen.height 少一截，底部留一条黑带），
  // 普通 resize / blur 都拉不回来。唯一的办法是在一个满屏高度元素上做一次
  // display 翻转，逼 WebKit 重新测量视口。
  var isStandalone = window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  var healFails = 0;
  var healDisabled = false;
  var lastHealAt = 0;

  function viewportShortfall() {
    if (!isStandalone) return 0;
    return Math.round(window.screen.height - window.innerHeight);
  }

  function healViewport() {
    if (healDisabled) return false;
    if (viewportShortfall() <= 4) return true;
    if (Date.now() - lastHealAt < 600) return false;
    lastHealAt = Date.now();

    var app = document.getElementById('app');
    if (!app) return false;
    var scrollTop = msgBox ? msgBox.scrollTop : 0;
    var prevDisplay = app.style.display;
    app.style.display = 'none';
    void app.offsetHeight;          // 同步重排，中间不绘制
    app.style.display = prevDisplay;
    if (msgBox) msgBox.scrollTop = scrollTop;

    var healed = viewportShortfall() <= 4;
    if (healed) {
      healFails = 0;
    } else if (++healFails >= 3) {
      // 翻转也救不回来，说明是系统层面裁掉了，别再让界面反复闪
      healDisabled = true;
    }
    return healed;
  }

  // 注意：自动触发只对「键盘把视口压小」的场景有效（iOS 17/18 可复现）。
  // 这台 iPhone 上是 iOS 26.1 的系统回归：竖屏 standalone 视口被永久裁掉 47pt，
  // 翻转也拉不回来（实测 797 → 797），所以不自动触发，避免白白闪屏；
  // 需要时在诊断面板里手动点「修复视口」。

  // ---- client id ----
  var CID_KEY = 'hst_client_id';
   var TOKEN_KEY = 'hst_api_token';
   var apiToken = localStorage.getItem(TOKEN_KEY) || '';
   tokenInput.value = apiToken;
   tokenSave.addEventListener('click', function() {
     apiToken = tokenInput.value.trim();
     localStorage.setItem(TOKEN_KEY, apiToken);
     pollStatus();
     connectEvents();
     refreshPushUi();
   });

   function authHeaders(extra) {
     var headers = extra || {};
     if (apiToken) headers.Authorization = 'Bearer ' + apiToken;
     return headers;
   }

   var clientId = localStorage.getItem(CID_KEY);
  if (!clientId) {
    clientId = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'c-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(CID_KEY, clientId);
  }

  // ---- helpers ----
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function apiFetch(path, options) {
    options = options || {};
    options.headers = authHeaders(options.headers || {});
    return fetch(path, options).then(function(r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }

  // 把 fetch 错误翻译成用户能看懂的一句话（网络失败时 message 不是数字）
  function requestErrorText(err) {
    var status = Number(err && err.message);
    if (!status) return '连不上服务端，请检查网络或服务是否已启动';
    if (status === 401 || status === 403) return '访问令牌无效，请在顶部输入正确的令牌';
    if (status === 413) return '录音太长，请缩短后重试';
    if (status === 503) return '服务还在启动（首次要加载语音模型），请稍后再试';
    return '服务端返回错误（HTTP ' + status + '）';
  }

  function daysText(left) {
    if (left == null) return '';
    return left < 0 ? '已过期 ' + (-left) + ' 天' : '剩 ' + left + ' 天';
  }

  function scrollBottom() {
    requestAnimationFrame(function() { msgBox.scrollTop = msgBox.scrollHeight; });
  }

  // 轻量 Markdown：只处理加粗、行内代码和列表；先 esc 再替换，避免注入
  function inlineMd(text) {
    return esc(text)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function renderMarkdown(text) {
    var lines = String(text == null ? '' : text).split(/\r?\n/);
    var html = '';
    var inList = false;
    lines.forEach(function(line) {
      var item = /^\s*(?:[-*]|\d+[.)])\s+(.*)$/.exec(line);
      if (item) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inlineMd(item[1]) + '</li>';
        return;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim() === '') { html += '<br>'; return; }
      html += inlineMd(line) + '<br>';
    });
    if (inList) html += '</ul>';
    return html.replace(/(<br>)+$/, '');
  }

  function addMsg(text, type, audio, opts) {
    // type: 'user' | 'bot' | 'error'
    // opts: { persist: false } 临时消息不入库；{ reminder: true } 标记为通知原文
    opts = opts || {};
    var row = document.createElement('div');
    row.className = 'msg-row ' + type + (opts.reminder ? ' reminder' : '');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(text);

    if (audio) {
      var btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.textContent = '🔊 播放';
      btn.addEventListener('click', function() {
        // Must create Audio in user-gesture context for iOS Safari
        var a = new Audio('data:audio/mp3;base64,' + audio);
        a.play().catch(function() {});
      });
      bubble.appendChild(document.createElement('br'));
      bubble.appendChild(btn);
    }

    row.appendChild(bubble);
    msgBox.appendChild(row);
    scrollBottom();

    // 报错是临时提示（麦克风授权失败等），不入库
    if (type !== 'error' && opts.persist !== false) {
      chatHistory.push({
        text: text,
        type: type,
        reminder: !!opts.reminder,
        at: Date.now()
      });
      if (chatHistory.length > CHAT_HISTORY_LIMIT) {
        chatHistory = chatHistory.slice(-CHAT_HISTORY_LIMIT);
      }
      saveChatHistory();
    }
  }

    if (dataState.status) params.set('status', dataState.status);

    apiFetch(DATA_ENDPOINTS[kind] + '?' + params.toString()).then(function(d) {

  // ---- Web Push 提醒通知 ----
  var pushStatus = document.getElementById('push-status');
  var pushEnable = document.getElementById('push-enable');
  var pushDisable = document.getElementById('push-disable');
  var pushTest = document.getElementById('push-test');

  function pushSupported() {
    return ('serviceWorker' in navigator) && ('PushManager' in window) &&
      ('Notification' in window);
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var raw = atob(base64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function pushHint() {
    if (!pushSupported()) return '这个浏览器不支持推送通知。';
    if (!isStandalone) return 'iPhone 上要先「添加到主屏幕」，从图标打开后才能开通知。';
    if (Notification.permission === 'denied') {
      return '通知权限被拒绝：请到 设置 → 通知 → 小马 里重新允许。';
    }
    return '';
  }

  // 把公钥和 Token 写进 IndexedDB：SW 处理 pushsubscriptionchange 时需要，
  // 那时页面通常没开着。关掉通知时清掉。
  function pushIdbOpen() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open('xiaoma-push', 1);
      req.onupgradeneeded = function() {
        var db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }

  function storePushConfig(publicKey) {
    if (!publicKey || !apiToken) return;
    pushIdbOpen().then(function(db) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put({ publicKey: publicKey, token: apiToken }, 'config');
    }).catch(function() { /* 存不了只是失去自动重订阅，不影响当前订阅 */ });
  }

  function clearPushConfig() {
    pushIdbOpen().then(function(db) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete('config');
    }).catch(function() {});
  }

  // ---- 点系统通知进来：把通知原文显示在聊天里 ----
  var lastReminderAt = 0;

  function showLastReminder(force) {
    return pushIdbOpen().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction('kv', 'readonly');
        var req = tx.objectStore('kv').get('last');
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
      });
    }).then(function(payload) {
      if (!payload || !payload.body) return;
      if (!force && payload.at && payload.at === lastReminderAt) return;
      lastReminderAt = payload.at || Date.now();
      switchTab('chat');
      addMsg(payload.body, 'bot', null, { reminder: true });
    }).catch(function() { /* 没有存过通知就什么都不做 */ });
  }

  function showPushButtons(canEnable, subscribed) {
    pushEnable.classList.toggle('hidden', !canEnable);
    pushDisable.classList.toggle('hidden', !subscribed);
    pushTest.classList.toggle('hidden', !subscribed);
  }

  function refreshPushUi() {
    if (!pushSupported()) {
      pushStatus.textContent = pushHint();
      showPushButtons(false, false);
      return;
    }
    apiFetch('/api/push/key').then(function(key) {
      if (!key.enabled) {
        pushStatus.textContent =
          '服务端未配置推送密钥（.env 的 PUSH_ENABLED / VAPID_*），' +
          '提醒仍只会在页面打开时出现。';
        showPushButtons(false, false);
        return null;
      }
      return navigator.serviceWorker.ready
        .then(function(reg) { return reg.pushManager.getSubscription(); })
        .then(function(sub) {
          if (sub) {
            storePushConfig(key.publicKey);
            pushStatus.textContent = '通知已开启：App 关着也能收到到期提醒。';
            showPushButtons(false, true);
          } else {
            pushStatus.textContent = pushHint() ||
              '通知未开启。开启后即使 App 关着也能收到到期提醒。';
            showPushButtons(true, false);
          }
        });
    }).catch(function(err) {
      pushStatus.textContent = '检查推送状态失败：' + requestErrorText(err);
    });
  }

  pushEnable.addEventListener('click', function() {
    pushEnable.disabled = true;
    var subKey = null;
    apiFetch('/api/push/key').then(function(key) {
      if (!key.enabled || !key.publicKey) throw new Error('服务端未配置推送密钥');
      subKey = key.publicKey;
      return Notification.requestPermission();
    }).then(function(permission) {
      if (permission !== 'granted') throw new Error('通知权限未授予');
      return navigator.serviceWorker.ready;
    }).then(function(reg) {
      return reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(subKey)
      });
    }).then(function(sub) {
      var json = sub.toJSON();
      return apiFetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          endpoint: json.endpoint,
          keys: json.keys,
          user_agent: navigator.userAgent
        })
      });
    }).then(function() {
      storePushConfig(subKey);
      refreshPushUi();
    }).catch(function(err) {
      pushStatus.textContent = '开启失败：' +
        (err && err.message ? err.message : requestErrorText(err));
    }).then(function() {
      pushEnable.disabled = false;
    });
  });

  pushDisable.addEventListener('click', function() {

      .then(function(reg) { return reg.pushManager.getSubscription(); })
      .then(function(sub) {
        if (!sub) return null;
        var endpoint = sub.endpoint;
        return sub.unsubscribe().then(function() {
          return apiFetch('/api/push/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: endpoint })
          });
        });
      })
      .then(function() {
        clearPushConfig();
        refreshPushUi();
      })
      .catch(function(err) {
        pushStatus.textContent = '关闭失败：' + requestErrorText(err);
      })
      .then(function() {
        pushDisable.disabled = false;
      });
  });

    dataState.offset = Math.max(0, dataState.offset - dataState.limit);
    loadData(dataState.kind);
  });
  pageNext.addEventListener('click', function() {
    dataState.offset += dataState.limit;
    loadData(dataState.kind);
  });

  dataList.addEventListener('click', function(e) {
    if (!e.target.closest) return;

    var editBtn = e.target.closest('button[data-edit-task]');
    if (editBtn) {
      openTaskEdit(editBtn.getAttribute('data-edit-task'));
      return;
    }

    var taskBtn = e.target.closest('button[data-task-id]');
    if (taskBtn) {
      var taskId = taskBtn.getAttribute('data-task-id');
      var action = taskBtn.getAttribute('data-action');
      apiFetch('/api/tasks/' + encodeURIComponent(taskId) + '/' + action, { method: 'POST' })
        .then(function() {
          loadData('tasks');
          loadOverview();
          pollStatus();
        })
        .catch(function(err) {
          alert('操作失败：' + requestErrorText(err));
        });
      return;
    }

    var deleteBtn = e.target.closest('button[data-delete-kind]');
    if (deleteBtn) {
      var kind = deleteBtn.getAttribute('data-delete-kind');
      var id = deleteBtn.getAttribute('data-delete-id');
      if (!confirm('确认删除这条记录？')) return;
      apiFetch(DELETE_ENDPOINTS[kind] + encodeURIComponent(id) + '?confirm=true', {
        method: 'DELETE'
      }).then(function() {
        loadData(kind);
        loadOverview();
        pollStatus();
      }).catch(function(err) {
        alert('删除失败：' + requestErrorText(err));
      });
    }
  });

  taskEditForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var values = {
      title: editTaskTitle.value.trim(),
      due_at: editTaskDue.value.trim(),
      type: editTaskType.value
    };
    apiFetch('/api/tasks/' + encodeURIComponent(editTaskId.value), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(values)
    }).then(function() {
      closeTaskEdit();
      loadData('tasks');
      loadOverview();
    }).catch(function(err) {
      alert('保存失败：' + requestErrorText(err));
    });
  });

  modalCancel.addEventListener('click', closeTaskEdit);
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeTaskEdit();
  });

  settingsSave.addEventListener('click', saveConfig);
  settingsForm.addEventListener('submit', function(e) {
    e.preventDefault();
    saveConfig();
  });

  configureDataStatus('memories');

  // ---- status poll ----
  function pollStatus() {
    fetch('/api/status', { headers: authHeaders() })
      .then(function(r) {
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function(d) {
        if (d.ok) {
          var txt = '🟢 服务正常 · 记忆 ' + (d.memory_count != null ? d.memory_count : '?') + ' 条';
          if (d.item_count != null) txt += ' · 物品 ' + d.item_count + ' 件';
          if (d.task_count != null) txt += ' · 任务 ' + d.task_count + ' 个';
          statusEl.textContent = txt;
          // 到期物品 / 任务提醒
          var due = [];
          (d.due_items || []).forEach(function(it) {
            due.push(it.name + '（' + (it.days_left < 0 ? '已过期' + (-it.days_left) + '天' : '剩' + it.days_left + '天') + '）');
          });
          (d.due_tasks || []).forEach(function(task) {
            due.push(task.title + '（' + (task.days_left < 0 ? '已过期' + (-task.days_left) + '天' : '剩' + task.days_left + '天') + '）');
          });
          if (due.length > 0) {
            statusEl.textContent += ' ⏰ ' + due.join('、');
          }
          if (document.getElementById('view-overview').classList.contains('active')) {
            loadOverview();
          }
        } else {
          statusEl.textContent = '🔴 服务异常';
        }
      })
      .catch(function(err) {
        statusEl.textContent = err && err.message === '401' ? '🔒 请输入正确的 API Token' : '🔴 服务连接失败';
      });
  }
  pollStatus();
  setInterval(pollStatus, 30000);

  // ---- 主动提醒：SSE 事件流（fetch 流式读取，才能带 Authorization 头）----
  var eventsAbort = null;

  function connectEvents() {
    if (eventsAbort) { try { eventsAbort.abort(); } catch (e) {} }
    eventsAbort = new AbortController();

    fetch('/api/events', {
      headers: authHeaders({ 'Accept': 'text/event-stream' }),
      signal: eventsAbort.signal
    })
    .then(function(r) {
      if (!r.ok || !r.body) throw new Error(r.status);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function(res) {
          if (res.done) throw new Error('closed');
          buf += decoder.decode(res.value, { stream: true });
          var frames = buf.split('\n\n');
          buf = frames.pop();
          frames.forEach(handleFrame);
          return pump();
        });
      }
      return pump();
    })
    .catch(function() {
      if (eventsAbort && eventsAbort.signal.aborted) return;  // 主动断开时不重连
      setTimeout(connectEvents, 5000);                        // 掉线 5s 后重连
    });
  }

  function handleFrame(frame) {
    var data = null;
    frame.split('\n').forEach(function(l) {
      if (l.indexOf('data:') === 0) data = l.slice(5).trim();
    });
    if (!data) return;  // 心跳 / 注释行
    var ev;
    try { ev = JSON.parse(data); } catch (e) { return; }
    if (ev.type === 'reminder') handleReminder(ev);
  }

  function handleReminder(ev) {
    addMsg(ev.reply || '有物品快到期了', 'bot', ev.audio || null);
    if (ev.audio) {
      try { new Audio('data:audio/mp3;base64,' + ev.audio).play().catch(function() {}); } catch (e) {}
    }
    pollStatus();  // 刷新状态栏到期列表
    if (document.getElementById('view-overview').classList.contains('active')) {
      loadOverview();
    }
  }

  connectEvents();

  // ---- PWA：注册 Service Worker（安装到主屏幕 + 离线壳 + 后续推送）----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function() { /* 不支持就算了 */ });
    });
  }

  // ---- 临时诊断：连续点三下标题，显示运行环境（排查 iOS 底部空带用）----
  function toggleDebugPanel() {
    var existing = document.getElementById('debug-panel');
    if (existing) { existing.remove(); return; }

    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;' +
      'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
    document.body.appendChild(probe);
    var probeStyle = getComputedStyle(probe);
    var safeTop = probeStyle.paddingTop;
    var safeBottom = probeStyle.paddingBottom;
    probe.remove();

    var vv = window.visualViewport;

    var dvhProbe = document.createElement('div');
    dvhProbe.style.cssText = 'position:absolute;visibility:hidden;width:0;height:100dvh;';
    document.body.appendChild(dvhProbe);
    var dvhValue = Math.round(dvhProbe.getBoundingClientRect().height);
    dvhProbe.remove();

    var appEl = document.getElementById('app');

    var lines = [
      'standalone(navigator): ' + (window.navigator.standalone === true),
      'display-mode standalone: ' + window.matchMedia('(display-mode: standalone)').matches,
      'innerHeight: ' + window.innerHeight,
      'visualViewport: ' + (vv ? Math.round(vv.height) : 'n/a'),
      'clientHeight: ' + document.documentElement.clientHeight,
      'screen.height: ' + window.screen.height,
      'body.height: ' + Math.round(document.body.getBoundingClientRect().height),
      '#app.height: ' + (appEl ? Math.round(appEl.getBoundingClientRect().height) : 'n/a'),
      '100dvh: ' + dvhValue,
      'shortfall: ' + viewportShortfall() + 'px（>4 即缩水）',
      'heal: ' + (healDisabled ? '已放弃（翻转无效）' : healFails + ' 次失败'),
      'safe-area top/bottom: ' + safeTop + ' / ' + safeBottom,
      'dpr: ' + window.devicePixelRatio
    ];

    var panel = document.createElement('div');
    panel.id = 'debug-panel';
    panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;' +
      'background:#000;color:#4ade80;font:12px/1.6 monospace;padding:10px;' +
      'border-radius:8px;white-space:pre-wrap;word-break:break-all;';
    panel.textContent = lines.join('\n');

    // 手动触发一次自愈，方便确认「翻转」到底能不能把视口拉回来
    var healBtn = document.createElement('button');
    healBtn.type = 'button';
    healBtn.textContent = '修复视口';
    healBtn.style.cssText = 'display:block;margin-top:8px;padding:6px 12px;border:0;' +
      'border-radius:6px;background:#4ade80;color:#000;font:12px monospace;';
    healBtn.addEventListener('click', function() {
      healFails = 0;
      healDisabled = false;
      lastHealAt = 0;
      var before = window.innerHeight;
      var ok = healViewport();
      healBtn.textContent = '修复视口（' + before + ' → ' + window.innerHeight + '）' +
        (ok ? ' ✅' : ' ❌');
    });
    panel.appendChild(healBtn);

    document.body.appendChild(panel);
  }

  (function bindDebugTap() {
    var title = document.querySelector('#status-bar h1');
    if (!title) return;
    var taps = 0;
    var timer = null;
    title.addEventListener('click', function() {
      taps += 1;
      clearTimeout(timer);
      timer = setTimeout(function() { taps = 0; }, 700);
      if (taps >= 3) { taps = 0; toggleDebugPanel(); }
    });
  })();

  // ---- 历史记录 / 欢迎语 ----
  if (chatHistory.length) {
    chatHistory.forEach(function(message) {
      addMsg(message.text, message.type || 'bot', null, {
        persist: false,
        reminder: !!message.reminder
      });
    });
  } else {
    renderWelcome();
  }

  // ---- 通知点进来：显示通知原文 ----
  if (/[?&]reminder=1(&|$)/.test(window.location.search)) {
    showLastReminder(true).then(function() {
      if (window.history && history.replaceState) {
        history.replaceState(null, '', window.location.pathname);
      }
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'open-reminder') showLastReminder(true);
    });
  }

  // ---- text send ----
  var busy = false;

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    textInput.disabled = v;
    recBtn.disabled = v;
    if (v) { sendBtn.textContent = '处理中…'; } else { sendBtn.textContent = '发送'; }
  }

  function sendText() {
    var t = textInput.value.trim();
    if (!t || busy) return;
    textInput.value = '';
    addMsg(t, 'user');
    setBusy(true);
    addTyping();

    fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ text: t, client_id: clientId })
    })
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(d) {
      removeTyping();
      addMsg(d.reply || '（空回复）', 'bot', d.audio || null);
    })
    .catch(function(err) {
      removeTyping();
      addMsg(requestErrorText(err), 'error');
    })
    .finally(function() { setBusy(false); });
  }

  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendText(); }
  });

  // ---- recording (Web Audio → PCM → resample 16kHz → WAV) ----

  var MIN_DURATION = 0.5;   // seconds
  var MAX_DURATION = 15;    // seconds

  var recording = false;
  var recPending = false;   // 已按下，正在等麦克风授权
  var recCancel  = false;   // 等授权期间松手 → 授权回来就取消
  var audioCtx  = null;
  var stream    = null;
  var source    = null;
  var processor = null;
  var chunks    = [];
  var recStart  = 0;
  var timer     = null;

  // 浏览器只在 HTTPS 或 localhost 下提供麦克风；局域网 http 访问时必须明确提示，
  // 否则 navigator.mediaDevices 是 undefined，会静默失败。
  function canUseMic() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
      (window.AudioContext || window.webkitAudioContext));
  }

  function startRecord() {
    if (busy || recording || recPending) return;

    if (!canUseMic()) {
      addMsg('当前地址用不了麦克风：浏览器要求 HTTPS 或 localhost 才允许录音。' +
        '可以先用下面的输入框打字，或者用 https 地址（例如 Tailscale）打开本页。', 'error');
      return;
    }

    chunks = [];
    recPending = true;
    recCancel = false;

    try {
      // Create AudioContext inside user gesture for iOS Safari
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (err) {
      recPending = false;
      addMsg('浏览器无法创建音频上下文，请更换浏览器或检查音频设备。', 'error');
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(s) {
      if (recCancel) {
        // 授权回来之前已经松手：不开始录，直接释放设备
        s.getTracks().forEach(function(t) { t.stop(); });
        cleanupAudio();
        recPending = false;
        addMsg('还没开始录音就松手了，请按住并等麦克风授权完成。', 'error');
        return;
      }

      stream = s;
      // Resume if suspended (iOS Safari)
      if (audioCtx.state === 'suspended') audioCtx.resume();

      source = audioCtx.createMediaStreamSource(stream);

      // ScriptProcessor to capture raw PCM
      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = function(e) {
        if (!recording) return;
        var data = e.inputBuffer.getChannelData(0);
        chunks.push(new Float32Array(data));
      };

      source.connect(processor);
      processor.connect(audioCtx.destination);

      recPending = false;
      recording = true;
      recStart  = Date.now();
      recBtn.classList.add('recording');
      recLabel.textContent = '正在录音… 0s';

      timer = setInterval(function() {
        var sec = Math.floor((Date.now() - recStart) / 1000);
        recLabel.textContent = '正在录音… ' + sec + 's';
        if (sec >= MAX_DURATION) stopAndSend();
      }, 200);
    })
    .catch(function(err) {
      recPending = false;
      addMsg('无法访问麦克风：' + ((err && err.message) || err), 'error');
      cleanupAudio();
    });
  }

  function stopAndSend() {
    // 还在等授权：这次按键作废，等 .then 里取消（fixes 快速松手后一直录到上限）
    if (recPending) {
      recCancel = true;
      return;
    }
    if (!recording) return;
    recording = false;
    clearInterval(timer);
    recBtn.classList.remove('recording');
    recLabel.textContent = '按住说话';

    var duration = (Date.now() - recStart) / 1000;
    var srcRate = audioCtx ? audioCtx.sampleRate : 48000;

    // Collect all chunks into one buffer
    var totalLen = 0;
    for (var i = 0; i < chunks.length; i++) totalLen += chunks[i].length;
    var merged = new Float32Array(totalLen);
    var offset = 0;
    for (var i = 0; i < chunks.length; i++) {
      merged.set(chunks[i], offset);
      offset += chunks[i].length;
    }
    chunks = [];

    cleanupAudio();

    if (duration < MIN_DURATION) {
      addMsg('说话时间太短，请按住多说一会儿', 'error');
      return;
    }

    // ---- resample to 16000 Hz (linear interpolation) ----
    var dstRate = 16000;
    var ratio   = srcRate / dstRate;
    var newLen  = Math.round(merged.length / ratio);
    var resampled = new Float32Array(newLen);
    for (var i = 0; i < newLen; i++) {
      var srcIdx = i * ratio;
      var lo = Math.floor(srcIdx);
      var hi = Math.min(lo + 1, merged.length - 1);
      var frac = srcIdx - lo;
      resampled[i] = merged[lo] * (1 - frac) + merged[hi] * frac;
    }

    // ---- encode WAV (16-bit PCM, mono, 16000 Hz) ----
    var wavBytes = encodeWAV(resampled, dstRate);

    var blob = new Blob([wavBytes], { type: 'audio/wav' });

    // Upload
    setBusy(true);
    addTyping();

    var fd = new FormData();
    fd.append('file', blob, 'recording.wav');
    fd.append('client_id', clientId);

    fetch('/api/voice', { method: 'POST', headers: authHeaders(), body: fd })
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(d) {
      removeTyping();
      addMsg(d.text || '（语音）', 'user');
      addMsg(d.reply || '（空回复）', 'bot', d.audio || null);
    })
    .catch(function(err) {
      removeTyping();
      addMsg(requestErrorText(err), 'error');
    })
    .finally(function() { setBusy(false); });
  }

  // ---- WAV encoder ----
  // Lines ~this function: WAV 44-byte header + PCM 16-bit data
  function encodeWAV(samples, sampleRate) {
    var numChannels = 1;
    var bitsPerSample = 16;
    var byteRate = sampleRate * numChannels * bitsPerSample / 8;
    var blockAlign = numChannels * bitsPerSample / 8;
    var dataLen = samples.length * blockAlign;
    var bufLen = 44 + dataLen;
    var buf = new ArrayBuffer(bufLen);
    var v = new DataView(buf);

    // RIFF header
    writeStr(v, 0, 'RIFF');
    v.setUint32(4, bufLen - 8, true);
    writeStr(v, 8, 'WAVE');

    // fmt chunk
    writeStr(v, 12, 'fmt ');
    v.setUint32(16, 16, true);           // chunk size
    v.setUint16(20, 1, true);            // PCM format
    v.setUint16(22, numChannels, true);
    v.setUint32(24, sampleRate, true);
    v.setUint32(28, byteRate, true);
    v.setUint16(32, blockAlign, true);
    v.setUint16(34, bitsPerSample, true);

    // data chunk
    writeStr(v, 36, 'data');
    v.setUint32(40, dataLen, true);

    // write PCM samples
    var off = 44;
    for (var i = 0; i < samples.length; i++, off += 2) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    return buf;
  }

  function writeStr(view, offset, str) {
    for (var i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }

  function cleanupAudio() {
    if (processor) { processor.disconnect(); processor.onaudioprocess = null; processor = null; }
    if (source)    { source.disconnect(); source = null; }
    if (stream)    { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
    if (audioCtx)  { audioCtx.close().catch(function(){}); audioCtx = null; }
  }

  // ---- record button: press / release ----
  // Use pointer events for better mobile support (handles finger+mouse)

  recBtn.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    startRecord();
  });

  recBtn.addEventListener('pointerup', function(e) {
    e.preventDefault();
    stopAndSend();
  });

  recBtn.addEventListener('pointerleave', function(e) {
    // finger slid off button while recording（等授权时也算，取消这次按键）
    if (recording || recPending) stopAndSend();
  });

  recBtn.addEventListener('pointercancel', function(e) {
    if (recording || recPending) stopAndSend();
  });

  // Prevent context menu on long press (mobile)
  recBtn.addEventListener('contextmenu', function(e) { e.preventDefault(); });

})();
</script>
