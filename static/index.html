<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>家庭智能终端 · 小马</title>
<style>
:root {
  --bg: #1b1f2a;
  --surface: #252a38;
  --surface-alt: #2d3348;
  --user-bubble: #3a7bd5;
  --user-text: #fff;
  --bot-bubble: #2e3448;
  --bot-text: #e4e8f1;
  --text-primary: #e8ecf4;
  --text-secondary: #8b93a8;
  --accent: #5b9cf5;
  --danger: #e85d5d;
  --input-bg: #2a2f40;
  --border: #3a4058;
  --record-active: #d94040;
  --radius: 14px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex; flex-direction: column;
  height: 100%; max-width: 600px; margin: 0 auto;
}

/* ---- status bar ---- */
#status-bar {
  flex-shrink: 0; padding: 16px 20px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
#status-bar h1 {
  font-size: 18px; font-weight: 700; letter-spacing: .5px;
  color: var(--text-primary);
}
#status-bar .sub {
  margin-top: 4px; font-size: 13px; color: var(--text-secondary);
}
#token-row {
  display: flex; gap: 8px; margin-top: 10px;
}
#token-input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
#token-save {
  height: 34px; padding: 0 12px; border: none;
  border-radius: var(--radius-sm); background: var(--accent); color: #fff;
}

/* ---- messages ---- */
#messages {
  flex: 1; overflow-y: auto; padding: 16px 16px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg-row { display: flex; margin-bottom: 12px; }
.msg-row.user { justify-content: flex-end; }
.msg-row.bot  { justify-content: flex-start; }
.msg-row.error { justify-content: center; }

.bubble {
  max-width: 80%; padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px; line-height: 1.55;
  word-break: break-word;
  position: relative;
}
.msg-row.user .bubble {
  background: var(--user-bubble); color: var(--user-text);
  border-bottom-right-radius: 4px;
}
.msg-row.bot .bubble {
  background: var(--bot-bubble); color: var(--bot-text);
  border-bottom-left-radius: 4px;
}
.msg-row.error .bubble {
  background: rgba(232,93,93,.15); color: var(--danger);
  font-size: 14px; max-width: 90%; text-align: center;
}

.play-btn {
  display: inline-block; margin-top: 6px;
  padding: 4px 10px; font-size: 13px;
  background: var(--surface-alt); color: var(--accent);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; user-select: none;
  transition: background .15s;
}
.play-btn:active { background: var(--border); }

/* ---- tabs / views ---- */
#tabs {
  flex-shrink: 0; display: flex; gap: 4px;
  padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tab {
  flex: 1; height: 34px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-secondary);
  font-size: 14px; cursor: pointer;
}
.tab.active { background: var(--surface-alt); color: var(--text-primary); font-weight: 600; }
#views { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.active { display: flex; flex-direction: column; }
.view-inner { flex: 1; overflow-y: auto; padding: 16px; }
.view-title { font-size: 18px; margin-bottom: 14px; }
.section-title { font-size: 14px; color: var(--text-secondary); margin: 18px 0 8px; }
.muted { color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
}
.card .num { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.card .label { margin-top: 4px; font-size: 12px; color: var(--text-secondary); }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 14px; line-height: 1.5;
}
.list-row .meta { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
.row-actions { display: flex; gap: 8px; margin-top: 8px; }
.small-btn {
  padding: 5px 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface-alt);
  color: var(--accent); font-size: 12px; cursor: pointer;
}
.small-btn.danger { color: var(--danger); }
.empty { color: var(--text-secondary); font-size: 13px; padding: 10px 0; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.subtab {
  padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 999px; background: transparent;
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
}
.subtab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
.field input {
  width: 100%; height: 38px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.primary-btn {
  width: 100%; height: 42px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 4px;
}
.hidden { display: none !important; }
.data-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
.data-toolbar input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.data-toolbar select {
  height: 34px; padding: 0 8px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.pager {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 14px;
}
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; background: rgba(0, 0, 0, .55);
}
.modal-card {
  width: min(100%, 420px); padding: 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.modal-card select {
  width: 100%; height: 38px; padding: 0 10px;
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}

/* ---- input area ---- */
#input-area {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}

#record-btn {
  width: 56px; height: 56px; flex-shrink: 0;
  border-radius: 50%; border: none;
  background: var(--accent); color: #fff;
  font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
  user-select: none; position: relative;
}
#record-btn.recording {
  background: var(--record-active);
  transform: scale(1.08);
}
#record-btn:disabled {
  opacity: .5; cursor: not-allowed;
}

#record-label {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; white-space: nowrap;
  color: var(--record-active); font-weight: 600;
  opacity: 0; transition: opacity .15s;
  pointer-events: none;
}
#record-btn.recording #record-label { opacity: 1; }

#text-input {
  flex: 1; height: 44px; padding: 0 14px;
  font-size: 16px; /* >=16px to prevent iOS zoom */
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 22px;
  outline: none;
  transition: border-color .15s;
}
#text-input::placeholder { color: var(--text-secondary); }
#text-input:focus { border-color: var(--accent); }

#send-btn {
  height: 44px; padding: 0 18px; flex-shrink: 0;
  border-radius: 22px; border: none;
  background: var(--accent); color: #fff;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
#send-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---- typing indicator ---- */
.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-secondary);
  animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
</style>
</head>
<body>

<div id="app">
  <div id="status-bar">
    <h1>家庭智能终端 · 小马</h1>
    <div class="sub" id="status-text">正在连接…</div>
    <div id="token-row">
      <input id="token-input" type="password" placeholder="API Token（如已配置）" autocomplete="off">
      <button id="token-save">保存 Token</button>
    </div>
  </div>

  <nav id="tabs">
    <button class="tab active" data-tab="chat" type="button">聊天</button>
    <button class="tab" data-tab="overview" type="button">概览</button>
    <button class="tab" data-tab="data" type="button">数据</button>
    <button class="tab" data-tab="settings" type="button">设置</button>
  </nav>

  <main id="views">
    <section id="view-chat" class="view active">
      <div id="messages"></div>
      <div id="input-area">
        <button id="record-btn" aria-label="按住说话">
          <span id="record-label">正在录音… 0s</span>
          🎤
        </button>
        <input id="text-input" type="text" placeholder="打字跟小马说话…" autocomplete="off">
        <button id="send-btn">发送</button>
      </div>
    </section>

    <section id="view-overview" class="view">
      <div class="view-inner">
        <h2 class="view-title">概览</h2>
        <div id="stat-cards" class="cards"></div>
        <h3 class="section-title">到期提醒</h3>
        <div id="overview-due" class="list"></div>
      </div>
    </section>

    <section id="view-data" class="view">
      <div class="view-inner">
        <h2 class="view-title">数据</h2>
        <div id="data-tabs" class="subtabs">
          <button class="subtab active" data-kind="memories" type="button">记忆</button>
          <button class="subtab" data-kind="items" type="button">物品</button>
          <button class="subtab" data-kind="tasks" type="button">任务</button>
          <button class="subtab" data-kind="facts" type="button">事实</button>
          <button class="subtab" data-kind="entities" type="button">实体</button>
        </div>
        <div class="data-toolbar">
          <input id="data-search" type="search" placeholder="搜索…" autocomplete="off">
          <select id="data-status" class="hidden"></select>
          <button id="data-refresh" class="small-btn" type="button">搜索</button>
        </div>
        <div id="data-list" class="list"></div>
        <div id="data-pager" class="pager">
          <button id="page-prev" class="small-btn" type="button">上一页</button>
          <span id="page-info" class="muted"></span>
          <button id="page-next" class="small-btn" type="button">下一页</button>
        </div>
      </div>
    </section>

    <section id="view-settings" class="view">
      <div class="view-inner">
        <h2 class="view-title">系统配置</h2>
        <div id="settings-summary" class="muted"></div>
        <form id="settings-form"></form>
        <button id="settings-save" class="primary-btn" type="button">保存配置</button>
        <div id="settings-msg" class="muted"></div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 class="view-title">编辑任务</h3>
    <form id="task-edit-form">
      <input type="hidden" id="edit-task-id">
      <div class="field">
        <label>标题</label>
        <input id="edit-task-title" type="text">
      </div>
      <div class="field">
        <label>到期时间</label>
        <input id="edit-task-due" type="text" placeholder="YYYY-MM-DD">
      </div>
      <div class="field">
        <label>类型</label>
        <select id="edit-task-type">
          <option value="bill">账单</option>
          <option value="schedule">日程</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="row-actions">
        <button type="submit" class="small-btn">保存</button>
        <button type="button" id="modal-cancel" class="small-btn">取消</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---- DOM refs ----
  var msgBox     = document.getElementById('messages');
  var statusEl   = document.getElementById('status-text');
  var tokenInput = document.getElementById('token-input');
  var tokenSave  = document.getElementById('token-save');
  var recBtn     = document.getElementById('record-btn');
  var recLabel   = document.getElementById('record-label');
  var textInput  = document.getElementById('text-input');
  var sendBtn    = document.getElementById('send-btn');
  var tabs       = document.querySelectorAll('.tab');
  var views      = document.querySelectorAll('.view');
  var statCards  = document.getElementById('stat-cards');
  var overviewDue = document.getElementById('overview-due');
  var dataTabs   = document.getElementById('data-tabs');
  var dataList   = document.getElementById('data-list');
  var dataSearch = document.getElementById('data-search');
  var dataStatus = document.getElementById('data-status');
  var dataRefresh = document.getElementById('data-refresh');
  var pagePrev   = document.getElementById('page-prev');
  var pageNext   = document.getElementById('page-next');
  var pageInfo   = document.getElementById('page-info');
  var modal      = document.getElementById('modal');
  var modalCancel = document.getElementById('modal-cancel');
  var taskEditForm = document.getElementById('task-edit-form');
  var editTaskId = document.getElementById('edit-task-id');
  var editTaskTitle = document.getElementById('edit-task-title');
  var editTaskDue = document.getElementById('edit-task-due');
  var editTaskType = document.getElementById('edit-task-type');
  var settingsForm = document.getElementById('settings-form');
  var settingsSave = document.getElementById('settings-save');
  var settingsSummary = document.getElementById('settings-summary');
  var settingsMsg = document.getElementById('settings-msg');
  var currentDataKind = 'memories';

  // ---- client id ----
  var CID_KEY = 'hst_client_id';
   var TOKEN_KEY = 'hst_api_token';
   var apiToken = localStorage.getItem(TOKEN_KEY) || '';
   tokenInput.value = apiToken;
   tokenSave.addEventListener('click', function() {
     apiToken = tokenInput.value.trim();
     localStorage.setItem(TOKEN_KEY, apiToken);
     pollStatus();
     connectEvents();
   });

   function authHeaders(extra) {
     var headers = extra || {};
     if (apiToken) headers.Authorization = 'Bearer ' + apiToken;
     return headers;
   }

   var clientId = localStorage.getItem(CID_KEY);
  if (!clientId) {
    clientId = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'c-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(CID_KEY, clientId);
  }

  // ---- helpers ----
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function apiFetch(path, options) {
    options = options || {};
    options.headers = authHeaders(options.headers || {});
    return fetch(path, options).then(function(r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    });
  }

  function daysText(left) {
    if (left == null) return '';
    return left < 0 ? '已过期 ' + (-left) + ' 天' : '剩 ' + left + ' 天';
  }

  function scrollBottom() {
    requestAnimationFrame(function() { msgBox.scrollTop = msgBox.scrollHeight; });
  }

  function addMsg(text, type, audio) {
    // type: 'user' | 'bot' | 'error'
    var row = document.createElement('div');
    row.className = 'msg-row ' + type;

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    if (audio) {
      var btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.textContent = '🔊 播放';
      btn.addEventListener('click', function() {
        // Must create Audio in user-gesture context for iOS Safari
        var a = new Audio('data:audio/mp3;base64,' + audio);
        a.play().catch(function() {});
      });
      bubble.appendChild(document.createElement('br'));
      bubble.appendChild(btn);
    }

    row.appendChild(bubble);
    msgBox.appendChild(row);
    scrollBottom();
  }

  function addTyping() {
    var row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-indicator';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    msgBox.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    var el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  // ---- tabs / overview / data / settings ----
  function switchTab(name) {
    tabs.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === name);
    });
    views.forEach(function(view) {
      view.classList.toggle('active', view.id === 'view-' + name);
    });
    if (name === 'overview') loadOverview();
    if (name === 'data') loadData(currentDataKind);
    if (name === 'settings') loadConfig();
    if (name === 'chat') setTimeout(scrollBottom, 0);
  }

  function loadOverview() {
    apiFetch('/api/stats').then(function(d) {
      var counts = d.counts || {};
      var byStatus = d.tasks_by_status || {};
      var cards = [
        ['记忆', counts.memories],
        ['物品', counts.items],
        ['任务', counts.tasks],
        ['待办任务', byStatus.pending],
        ['事实', counts.facts],
        ['实体', counts.entities]
      ];
      statCards.innerHTML = cards.map(function(card) {
        return '<div class="card"><div class="num">' + esc(card[1] == null ? 0 : card[1]) +
          '</div><div class="label">' + esc(card[0]) + '</div></div>';
      }).join('');

      var rows = [];
      (d.due_items || []).forEach(function(item) {
        rows.push('<div class="list-row">' + esc(item.name) +
          '<div class="meta">物品 · ' + esc(daysText(item.days_left)) + '</div></div>');
      });
      (d.due_tasks || []).forEach(function(task) {
        rows.push('<div class="list-row">' + esc(task.title) +
          '<div class="meta">任务 · ' + esc(daysText(task.days_left)) + '</div></div>');
      });
      overviewDue.innerHTML = rows.length ? rows.join('') : '<div class="empty">暂无到期提醒</div>';
    }).catch(function(err) {
      overviewDue.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  var DATA_ENDPOINTS = {
    memories: '/api/memories',
    items: '/api/items',
    tasks: '/api/tasks',
    facts: '/api/facts',
    entities: '/api/entities'
  };

  var DELETE_ENDPOINTS = {
    memories: '/api/memories/',
    items: '/api/items/',
    tasks: '/api/tasks/',
    facts: '/api/facts/'
  };

  var DATA_STATUS_OPTIONS = {
    items: [['', '全部状态'], ['active', '有效'], ['reminded', '已提醒'], ['expired', '已过期']],
    tasks: [['', '全部状态'], ['pending', '待办'], ['reminded', '已提醒'], ['done', '已完成'], ['cancelled', '已取消']]
  };

  var STATUS_LABELS = {
    active: '有效', reminded: '已提醒', expired: '已过期',
    pending: '待办', done: '已完成', cancelled: '已取消'
  };

  var ENTITY_LABELS = {
    property: '住所', person: '家庭成员', product: '物品',
    provider: '缴费单位', place: '地点', device: '设备'
  };

  var dataState = {
    kind: 'memories', q: '', status: '',
    limit: 20, offset: 0, total: 0
  };
  var lastData = {};

  function configureDataStatus(kind) {
    var options = DATA_STATUS_OPTIONS[kind];
    if (!options) {
      dataStatus.classList.add('hidden');
      dataStatus.innerHTML = '';
      dataStatus.value = '';
      return;
    }
    dataStatus.classList.remove('hidden');
    dataStatus.innerHTML = options.map(function(option) {
      return '<option value="' + esc(option[0]) + '">' + esc(option[1]) + '</option>';
    }).join('');
    dataStatus.value = '';
  }

  function loadData(kind, reset) {
    if (kind !== dataState.kind) {
      dataState.kind = kind;
      dataState.q = '';
      dataState.status = '';
      dataState.offset = 0;
      dataSearch.value = '';
      configureDataStatus(kind);
    }
    if (reset) dataState.offset = 0;

    currentDataKind = kind;
    dataTabs.querySelectorAll('.subtab').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-kind') === kind);
    });

    dataState.q = dataSearch.value.trim();
    dataState.status = dataStatus.value || '';

    var params = new URLSearchParams();
    params.set('limit', String(dataState.limit));
    params.set('offset', String(dataState.offset));
    if (dataState.q) params.set('q', dataState.q);
    if (dataState.status) params.set('status', dataState.status);

    apiFetch(DATA_ENDPOINTS[kind] + '?' + params.toString()).then(function(d) {
      dataState.total = d.total || 0;
      if (dataState.offset > 0 && dataState.offset >= dataState.total) {
        dataState.offset = Math.max(0, dataState.offset - dataState.limit);
        return loadData(kind);
      }
      lastData = d;
      renderData(kind, d);
      renderPager();
    }).catch(function(err) {
      dataList.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  function renderPager() {
    var pages = Math.max(1, Math.ceil(dataState.total / dataState.limit));
    var page = Math.floor(dataState.offset / dataState.limit) + 1;
    pageInfo.textContent = '第 ' + page + ' / ' + pages + ' 页 · 共 ' + dataState.total + ' 条';
    pagePrev.disabled = dataState.offset <= 0;
    pageNext.disabled = dataState.offset + dataState.limit >= dataState.total;
  }

  function deleteButton(kind, id) {
    return '<button class="small-btn danger" data-delete-kind="' + esc(kind) +
      '" data-delete-id="' + esc(id) + '">删除</button>';
  }

  function renderData(kind, data) {
    var rows = [];
    if (kind === 'memories') {
      (data.memories || []).forEach(function(m) {
        rows.push('<div class="list-row">' + esc(m.text) +
          '<div class="meta">' + esc(m.time) +
          (m.summary ? ' · ' + esc(m.summary) : '') +
          '</div><div class="row-actions">' + deleteButton('memories', m.id) + '</div></div>');
      });
    } else if (kind === 'items') {
      (data.items || []).forEach(function(item) {
        rows.push('<div class="list-row">' + esc(item.name) +
          '<div class="meta">到期 ' + esc(item.expiry_date || '未知') +
          ' · ' + esc(STATUS_LABELS[item.status] || item.status) + '</div>' +
          '<div class="row-actions">' + deleteButton('items', item.id) + '</div></div>');
      });
    } else if (kind === 'tasks') {
      (data.tasks || []).forEach(function(task) {
        var actions = '<div class="row-actions">';
        if (task.status === 'pending' || task.status === 'reminded') {
          actions += '<button class="small-btn" data-task-id="' + esc(task.id) + '" data-action="complete">完成</button>';
          actions += '<button class="small-btn danger" data-task-id="' + esc(task.id) + '" data-action="cancel">取消</button>';
        }
        actions += '<button class="small-btn" data-edit-task="' + esc(task.id) + '">编辑</button>';
        actions += deleteButton('tasks', task.id);
        actions += '</div>';
        rows.push('<div class="list-row">#' + esc(task.id) + ' ' + esc(task.title) +
          '<div class="meta">' + esc(task.due_at || '未定') +
          ' · ' + esc(STATUS_LABELS[task.status] || task.status) + '</div>' + actions + '</div>');
      });
    } else if (kind === 'facts') {
      (data.facts || []).forEach(function(fact) {
        rows.push('<div class="list-row">' + esc(fact.subject) + ' · ' +
          esc(fact.predicate) + '：' + esc(fact.value) +
          (fact.source ? '<div class="meta">来源：' + esc(fact.source) + '</div>' : '') +
          '<div class="row-actions">' + deleteButton('facts', fact.id) + '</div></div>');
      });
    } else if (kind === 'entities') {
      (data.entities || []).forEach(function(entity) {
        var aliases = (entity.aliases || []).join('、');
        rows.push('<div class="list-row">' + esc(entity.canonical_name) +
          '<div class="meta">' + esc(ENTITY_LABELS[entity.type] || entity.type) +
          (aliases ? ' · 别名：' + esc(aliases) : '') + '</div></div>');
      });
    }
    dataList.innerHTML = rows.length ? rows.join('') : '<div class="empty">暂无数据</div>';
  }

  function openTaskEdit(taskId) {
    var task = null;
    (lastData.tasks || []).forEach(function(item) {
      if (String(item.id) === String(taskId)) task = item;
    });
    if (!task) return;
    editTaskId.value = task.id;
    editTaskTitle.value = task.title || '';
    editTaskDue.value = task.due_at || '';
    editTaskType.value = task.type || 'custom';
    modal.classList.remove('hidden');
  }

  function closeTaskEdit() {
    modal.classList.add('hidden');
  }

  var CONFIG_FIELDS = [
    ['TTS_VOICE', '语音角色', 'text'],
    ['REMINDER_DAYS', '提前提醒天数', 'number'],
    ['REMINDER_INTERVAL_SECONDS', '扫描间隔（秒）', 'number'],
    ['REMINDER_COOLDOWN_HOURS', '重复提醒冷却（小时）', 'number'],
    ['SESSION_CONTEXT_TURNS', '多轮上下文轮数', 'number'],
    ['SESSION_CONTEXT_MAX_CHARS', '单条历史最大字数', 'number'],
    ['PROPOSAL_DEDUPE_SECONDS', '写提案去重窗口（秒）', 'number'],
    ['PENDING_ACTION_TTL_SECONDS', '待澄清过期（秒）', 'number'],
    ['WAKE_WORD', '唤醒词', 'text'],
    ['WAKE_ACK_TEXT', '唤醒应答', 'text']
  ];

  function loadConfig() {
    apiFetch('/api/config').then(function(d) {
      var llm = d.llm || {};
      settingsSummary.innerHTML =
        '模型：' + esc(llm.model || '未配置') +
        '（' + (llm.configured ? '已配置' : '未配置') + '）<br>' +
        'API Token：' + (d.api_token_enabled ? '已启用' : '未启用') + '<br>' +
        '数据库：' + esc(JSON.stringify(d.db_paths || {}));
      var values = d.values || {};
      settingsForm.innerHTML = CONFIG_FIELDS.map(function(field) {
        return '<div class="field"><label>' + esc(field[1]) + '（' + esc(field[0]) +
          '）</label><input data-config-key="' + esc(field[0]) + '" type="' + field[2] +
          '" value="' + esc(values[field[0]]) + '"></div>';
      }).join('');
      settingsMsg.textContent = '配置保存到本地 .env，重启服务端后生效。';
    }).catch(function(err) {
      settingsSummary.textContent = '加载失败：' + err.message;
    });
  }

  function saveConfig() {
    var values = {};
    CONFIG_FIELDS.forEach(function(field) {
      var input = settingsForm.querySelector('[data-config-key="' + field[0] + '"]');
      if (input) values[field[0]] = input.value;
    });
    apiFetch('/api/config', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: values })
    }).then(function() {
      settingsMsg.textContent = '已保存。重启服务端后生效。';
    }).catch(function(err) {
      settingsMsg.textContent = '保存失败：' + err.message;
    });
  }

  tabs.forEach(function(btn) {
    btn.addEventListener('click', function() {
      switchTab(btn.getAttribute('data-tab'));
    });
  });

  dataTabs.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('button[data-kind]') : null;
    if (btn) loadData(btn.getAttribute('data-kind'), true);
  });

  dataRefresh.addEventListener('click', function() {
    loadData(dataState.kind, true);
  });
  dataSearch.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      loadData(dataState.kind, true);
    }
  });
  dataStatus.addEventListener('change', function() {
    loadData(dataState.kind, true);
  });
  pagePrev.addEventListener('click', function() {
    dataState.offset = Math.max(0, dataState.offset - dataState.limit);
    loadData(dataState.kind);
  });
  pageNext.addEventListener('click', function() {
    dataState.offset += dataState.limit;
    loadData(dataState.kind);
  });

  dataList.addEventListener('click', function(e) {
    if (!e.target.closest) return;

    var editBtn = e.target.closest('button[data-edit-task]');
    if (editBtn) {
      openTaskEdit(editBtn.getAttribute('data-edit-task'));
      return;
    }

    var taskBtn = e.target.closest('button[data-task-id]');
    if (taskBtn) {
      var taskId = taskBtn.getAttribute('data-task-id');
      var action = taskBtn.getAttribute('data-action');
      apiFetch('/api/tasks/' + encodeURIComponent(taskId) + '/' + action, { method: 'POST' })
        .then(function() {
          loadData('tasks');
          loadOverview();
          pollStatus();
        })
        .catch(function(err) {
          alert('操作失败：' + err.message);
        });
      return;
    }

    var deleteBtn = e.target.closest('button[data-delete-kind]');
    if (deleteBtn) {
      var kind = deleteBtn.getAttribute('data-delete-kind');
      var id = deleteBtn.getAttribute('data-delete-id');
      if (!confirm('确认删除这条记录？')) return;
      apiFetch(DELETE_ENDPOINTS[kind] + encodeURIComponent(id) + '?confirm=true', {
        method: 'DELETE'
      }).then(function() {
        loadData(kind);
        loadOverview();
        pollStatus();
      }).catch(function(err) {
        alert('删除失败：' + err.message);
      });
    }
  });

  taskEditForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var values = {
      title: editTaskTitle.value.trim(),
      due_at: editTaskDue.value.trim(),
      type: editTaskType.value
    };
    apiFetch('/api/tasks/' + encodeURIComponent(editTaskId.value), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(values)
    }).then(function() {
      closeTaskEdit();
      loadData('tasks');
      loadOverview();
    }).catch(function(err) {
      alert('保存失败：' + err.message);
    });
  });

  modalCancel.addEventListener('click', closeTaskEdit);
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeTaskEdit();
  });

  settingsSave.addEventListener('click', saveConfig);
  settingsForm.addEventListener('submit', function(e) {
    e.preventDefault();
    saveConfig();
  });

  configureDataStatus('memories');

  // ---- status poll ----
  function pollStatus() {
    fetch('/api/status', { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          var txt = '🟢 服务正常 · 记忆 ' + (d.memory_count != null ? d.memory_count : '?') + ' 条';
          if (d.item_count != null) txt += ' · 物品 ' + d.item_count + ' 件';
          if (d.task_count != null) txt += ' · 任务 ' + d.task_count + ' 个';
          statusEl.textContent = txt;
          // 到期物品 / 任务提醒
          var due = [];
          (d.due_items || []).forEach(function(it) {
            due.push(it.name + '（' + (it.days_left < 0 ? '已过期' + (-it.days_left) + '天' : '剩' + it.days_left + '天') + '）');
          });
          (d.due_tasks || []).forEach(function(task) {
            due.push(task.title + '（' + (task.days_left < 0 ? '已过期' + (-task.days_left) + '天' : '剩' + task.days_left + '天') + '）');
          });
          if (due.length > 0) {
            statusEl.textContent += ' ⏰ ' + due.join('、');
          }
          if (document.getElementById('view-overview').classList.contains('active')) {
            loadOverview();
          }
        } else {
          statusEl.textContent = '🔴 服务异常';
        }
      })
      .catch(function(err) {
        statusEl.textContent = err && err.message === '401' ? '🔒 请输入正确的 API Token' : '🔴 服务连接失败';
      });
  }
  pollStatus();
  setInterval(pollStatus, 30000);

  // ---- 主动提醒：SSE 事件流（fetch 流式读取，才能带 Authorization 头）----
  var eventsAbort = null;

  function connectEvents() {
    if (eventsAbort) { try { eventsAbort.abort(); } catch (e) {} }
    eventsAbort = new AbortController();

    fetch('/api/events', {
      headers: authHeaders({ 'Accept': 'text/event-stream' }),
      signal: eventsAbort.signal
    })
    .then(function(r) {
      if (!r.ok || !r.body) throw new Error(r.status);
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function(res) {
          if (res.done) throw new Error('closed');
          buf += decoder.decode(res.value, { stream: true });
          var frames = buf.split('\n\n');
          buf = frames.pop();
          frames.forEach(handleFrame);
          return pump();
        });
      }
      return pump();
    })
    .catch(function() {
      if (eventsAbort && eventsAbort.signal.aborted) return;  // 主动断开时不重连
      setTimeout(connectEvents, 5000);                        // 掉线 5s 后重连
    });
  }

  function handleFrame(frame) {
    var data = null;
    frame.split('\n').forEach(function(l) {
      if (l.indexOf('data:') === 0) data = l.slice(5).trim();
    });
    if (!data) return;  // 心跳 / 注释行
    var ev;
    try { ev = JSON.parse(data); } catch (e) { return; }
    if (ev.type === 'reminder') handleReminder(ev);
  }

  function handleReminder(ev) {
    addMsg(ev.reply || '有物品快到期了', 'bot', ev.audio || null);
    if (ev.audio) {
      try { new Audio('data:audio/mp3;base64,' + ev.audio).play().catch(function() {}); } catch (e) {}
    }
    pollStatus();  // 刷新状态栏到期列表
    if (document.getElementById('view-overview').classList.contains('active')) {
      loadOverview();
    }
  }

  connectEvents();

  // ---- welcome message ----
  addMsg('你好，我是小马，家里的记忆助手。按住说话，或者打字跟我聊。先试试这样用我：告诉我"酸奶8月5号过期"，我会记住；之后你随时问我"酸奶还有几天过期"，我就能答上来啦。', 'bot');

  // ---- text send ----
  var busy = false;

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    textInput.disabled = v;
    recBtn.disabled = v;
    if (v) { sendBtn.textContent = '处理中…'; } else { sendBtn.textContent = '发送'; }
  }

  function sendText() {
    var t = textInput.value.trim();
    if (!t || busy) return;
    textInput.value = '';
    addMsg(t, 'user');
    setBusy(true);
    addTyping();

    fetch('/api/chat', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ text: t, client_id: clientId })
    })
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(d) {
      removeTyping();
      addMsg(d.reply || '（空回复）', 'bot', d.audio || null);
    })
    .catch(function() {
      removeTyping();
      addMsg('出错了，请检查服务端连接', 'error');
    })
    .finally(function() { setBusy(false); });
  }

  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendText(); }
  });

  // ---- recording (Web Audio → PCM → resample 16kHz → WAV) ----

  var MIN_DURATION = 0.5;   // seconds
  var MAX_DURATION = 15;    // seconds

  var recording = false;
  var audioCtx  = null;
  var stream    = null;
  var source    = null;
  var processor = null;
  var chunks    = [];
  var recStart  = 0;
  var timer     = null;

  function startRecord() {
    if (busy || recording) return;

    chunks = [];
    // Create AudioContext inside user gesture for iOS Safari
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(s) {
      stream = s;
      // Resume if suspended (iOS Safari)
      if (audioCtx.state === 'suspended') audioCtx.resume();

      source = audioCtx.createMediaStreamSource(stream);

      // ScriptProcessor to capture raw PCM
      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = function(e) {
        if (!recording) return;
        var data = e.inputBuffer.getChannelData(0);
        chunks.push(new Float32Array(data));
      };

      source.connect(processor);
      processor.connect(audioCtx.destination);

      recording = true;
      recStart  = Date.now();
      recBtn.classList.add('recording');
      recLabel.textContent = '正在录音… 0s';

      timer = setInterval(function() {
        var sec = Math.floor((Date.now() - recStart) / 1000);
        recLabel.textContent = '正在录音… ' + sec + 's';
        if (sec >= MAX_DURATION) stopAndSend();
      }, 200);
    })
    .catch(function(err) {
      addMsg('无法访问麦克风：' + err.message, 'error');
      cleanupAudio();
    });
  }

  function stopAndSend() {
    if (!recording) return;
    recording = false;
    clearInterval(timer);
    recBtn.classList.remove('recording');

    var duration = (Date.now() - recStart) / 1000;
    var srcRate = audioCtx ? audioCtx.sampleRate : 48000;

    // Collect all chunks into one buffer
    var totalLen = 0;
    for (var i = 0; i < chunks.length; i++) totalLen += chunks[i].length;
    var merged = new Float32Array(totalLen);
    var offset = 0;
    for (var i = 0; i < chunks.length; i++) {
      merged.set(chunks[i], offset);
      offset += chunks[i].length;
    }
    chunks = [];

    cleanupAudio();

    if (duration < MIN_DURATION) {
      addMsg('说话时间太短，请按住多说一会儿', 'error');
      return;
    }

    // ---- resample to 16000 Hz (linear interpolation) ----
    var dstRate = 16000;
    var ratio   = srcRate / dstRate;
    var newLen  = Math.round(merged.length / ratio);
    var resampled = new Float32Array(newLen);
    for (var i = 0; i < newLen; i++) {
      var srcIdx = i * ratio;
      var lo = Math.floor(srcIdx);
      var hi = Math.min(lo + 1, merged.length - 1);
      var frac = srcIdx - lo;
      resampled[i] = merged[lo] * (1 - frac) + merged[hi] * frac;
    }

    // ---- encode WAV (16-bit PCM, mono, 16000 Hz) ----
    var wavBytes = encodeWAV(resampled, dstRate);

    var blob = new Blob([wavBytes], { type: 'audio/wav' });

    // Upload
    setBusy(true);
    addTyping();

    var fd = new FormData();
    fd.append('file', blob, 'recording.wav');
    fd.append('client_id', clientId);

    fetch('/api/voice', { method: 'POST', headers: authHeaders(), body: fd })
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(d) {
      removeTyping();
      addMsg(d.text || '（语音）', 'user');
      addMsg(d.reply || '（空回复）', 'bot', d.audio || null);
    })
    .catch(function() {
      removeTyping();
      addMsg('出错了，请检查服务端连接', 'error');
    })
    .finally(function() { setBusy(false); });
  }

  // ---- WAV encoder ----
  // Lines ~this function: WAV 44-byte header + PCM 16-bit data
  function encodeWAV(samples, sampleRate) {
    var numChannels = 1;
    var bitsPerSample = 16;
    var byteRate = sampleRate * numChannels * bitsPerSample / 8;
    var blockAlign = numChannels * bitsPerSample / 8;
    var dataLen = samples.length * blockAlign;
    var bufLen = 44 + dataLen;
    var buf = new ArrayBuffer(bufLen);
    var v = new DataView(buf);

    // RIFF header
    writeStr(v, 0, 'RIFF');
    v.setUint32(4, bufLen - 8, true);
    writeStr(v, 8, 'WAVE');

    // fmt chunk
    writeStr(v, 12, 'fmt ');
    v.setUint32(16, 16, true);           // chunk size
    v.setUint16(20, 1, true);            // PCM format
    v.setUint16(22, numChannels, true);
    v.setUint32(24, sampleRate, true);
    v.setUint32(28, byteRate, true);
    v.setUint16(32, blockAlign, true);
    v.setUint16(34, bitsPerSample, true);

    // data chunk
    writeStr(v, 36, 'data');
    v.setUint32(40, dataLen, true);

    // write PCM samples
    var off = 44;
    for (var i = 0; i < samples.length; i++, off += 2) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    return buf;
  }

  function writeStr(view, offset, str) {
    for (var i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }

  function cleanupAudio() {
    if (processor) { processor.disconnect(); processor.onaudioprocess = null; processor = null; }
    if (source)    { source.disconnect(); source = null; }
    if (stream)    { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
    if (audioCtx)  { audioCtx.close().catch(function(){}); audioCtx = null; }
  }

  // ---- record button: press / release ----
  // Use pointer events for better mobile support (handles finger+mouse)

  recBtn.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    startRecord();
  });

  recBtn.addEventListener('pointerup', function(e) {
    e.preventDefault();
    stopAndSend();
  });

  recBtn.addEventListener('pointerleave', function(e) {
    // finger slid off button while recording
    if (recording) stopAndSend();
  });

  recBtn.addEventListener('pointercancel', function(e) {
    if (recording) stopAndSend();
  });

  // Prevent context menu on long press (mobile)
  recBtn.addEventListener('contextmenu', function(e) { e.preventDefault(); });

})();
</script>
