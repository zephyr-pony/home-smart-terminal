# 用法：
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env      # 至少填 LLM 三项，并且必须设 API_TOKEN
#   docker compose up -d --build
#
# 需要语音识别（镜像会大 2GB 以上）：
#   docker compose build --build-arg INSTALL_STT=1
#   同时在 .env 里设 STT_ENABLED=1，否则镜像装了模型也不会加载。
services:
  xiaoma:
    build:
      context: .
      args:
        INSTALL_STT: "0"
        # 打印（D61）：CUPS 客户端 + LibreOffice；不打印就改 0
        INSTALL_PRINT: "1"
        # 国内网络构建拉不到 deb.debian.org / PyPI 时，取消下面两行注释：
        # APT_MIRROR: mirrors.aliyun.com
        # PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: xiaoma:local
    container_name: xiaoma
    restart: unless-stopped
    # 日志轮转（D67）：不设这个，容器日志只涨不删，跑几个月能把盘吃满。
    # 10MB × 3 份封顶，旧日志由 Docker 自己滚掉。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # 宿主机端口用 .env 的 SERVER_PORT（家里是 8208），容器里固定 8000
      - "${SERVER_PORT:-8208}:8000"
    env_file:
      - .env
    environment:
      # 容器里必须监听 0.0.0.0；访问控制靠 API_TOKEN 与端口映射，
      # 别把 SERVER_HOST 改回 127.0.0.1（那样宿主机也连不上）。
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATA_DIR: /data
      TZ: "${TZ:-Asia/Shanghai}"
      # 容器里的 127.0.0.1 是容器自己：HA 在宿主机上，所以走 host.docker.internal。
      # 数据路径不要用 DB_PATH 覆盖，默认跟着 DATA_DIR=/data 走。
      # LLM_PROXY / WEB_PROXY 留空 = 直连；只有确实需要代理时才填（如企业网络）。
      # 打印在 .env 里配：
      #   PRINTER_SERVER=192.168.1.15:631   # 家里共享打印机的 CUPS 地址
      #   PRINTER_NAME=HP1020               # lpstat -h <server> -a 的队列名
      # 镜像默认没装 funasr；这里盖掉 .env 里的 STT_ENABLED=1，避免启动即崩。
      # 用 --build-arg INSTALL_STT=1 构建后，再把这一行改成 "1"。
      STT_ENABLED: "0"
    extra_hosts:
      # 和 xiaozhi 容器一致：容器里用 host.docker.internal 访问宿主机
      - "host.docker.internal:host-gateway"
    volumes:
      # 用命名卷：Linux 上换成 bind mount（./data:/data）会撞上容器内 uid 10001
      # 没有写权限的问题。要 bind mount 就先 chown 10001:10001 ./data。
      - xiaoma-data:/data
      # FunASR / torch 的模型缓存放这里：重建容器不用重新下 900MB
      - xiaoma-cache:/home/xiaoma/.cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  xiaoma-data:
  xiaoma-cache:
